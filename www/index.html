<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#6366f1" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<title>Math Quest · 수학 퀘스트</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%236366f1'/><stop offset='1' stop-color='%238b5cf6'/></linearGradient><clipPath id='c'><rect width='64' height='64' rx='14'/></clipPath></defs><g clip-path='url(%23c)'><rect width='64' height='64' fill='url(%23g)'/><circle cx='62' cy='6' r='22' fill='white' fill-opacity='0.18'/><circle cx='64' cy='68' r='14' fill='white' fill-opacity='0.10'/><path d='M8 54V12h7l17 22 17-22h7v42h-9V28L34 44h-4L17 28v26z' fill='white'/><path d='M54 8v8M50 12h8' stroke='%23fbbf24' stroke-width='3' stroke-linecap='round'/></g></svg>"/>
<style>
  :root {
    /* 모던 프리미엄 — 화이트 + 인디고 + 따뜻한 엠버 */
    --bg: #fafaff;
    --bg-soft: #f3f4ff;
    --surface: #ffffff;
    --surface-soft: #f8f9fc;
    --border: #e8eaf3;
    --border-soft: #f0f2f8;
    --text: #1a1d2e;
    --text-soft: #5a5f78;
    --text-muted: #8b91a8;

    --primary: #6366f1;          /* 인디고 — 메인 브랜드 */
    --primary-deep: #4f46e5;
    --primary-soft: #eef0ff;
    --secondary: #8b5cf6;        /* 바이올렛 */
    --accent: #f59e0b;           /* 엠버 — 에너지/보상 */
    --accent-soft: #fef3e2;
    --success: #10b981;
    --danger: #ef4444;
    --danger-soft: #fee2e2;
    --warn: #f97316;
    --gold: #fbbf24;             /* 별 황금 */
    --pink: #ec4899;
    --cyan: #06b6d4;

    --radius: 16px;
    --radius-lg: 20px;
    --radius-sm: 10px;

    --shadow-sm: 0 1px 2px rgba(20, 25, 50, 0.04), 0 2px 6px rgba(20, 25, 50, 0.04);
    --shadow: 0 2px 6px rgba(20, 25, 50, 0.06), 0 8px 24px rgba(20, 25, 50, 0.06);
    --shadow-lg: 0 4px 12px rgba(20, 25, 50, 0.08), 0 16px 40px rgba(20, 25, 50, 0.1);
    --shadow-primary: 0 6px 20px rgba(99, 102, 241, 0.25);
    --shadow-accent: 0 6px 20px rgba(245, 158, 11, 0.25);

    --font: 'Pretendard', 'Apple SD Gothic Neo', 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    user-select: none;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }
  #app {
    max-width: 480px; margin: 0 auto; height: 100dvh; height: 100vh;
    display: flex; flex-direction: column; position: relative;
    background: var(--bg);
    overflow: hidden;
  }
  .screen { flex: 1; display: flex; flex-direction: column; overflow: hidden; animation: fadeIn .25s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

  /* === Top bar === */
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 20px;
    background: var(--bg);
    color: var(--text);
    z-index: 5;
  }
  .topbar .title {
    font-weight: 800; font-size: 17px;
    letter-spacing: -0.4px;
    color: var(--text);
  }
  .topbar .sub {
    font-size: 12px; color: var(--text-muted);
    letter-spacing: -0.2px; margin-top: 2px;
    font-weight: 500;
  }

  /* 홈 탑바 — 인사 + 우측 코인/뮤트 */
  .topbar-home { padding: 18px 20px 12px; }
  .home-hello { display: flex; flex-direction: column; }
  .hello-greeting {
    font-size: 17px; font-weight: 800;
    color: var(--text); letter-spacing: -0.5px;
    line-height: 1.2;
  }
  .hello-sub {
    font-size: 12px; font-weight: 600;
    color: var(--text-muted); letter-spacing: -0.2px;
    margin-top: 3px;
  }
  .topbar .back {
    background: var(--surface-soft);
    border: 1px solid var(--border);
    color: var(--text);
    width: 38px; height: 38px; border-radius: 12px;
    font-size: 17px; font-weight: 700; cursor: pointer;
    transition: background .15s;
  }
  .topbar .back:active { background: var(--border); }
  .topbar .coins {
    background: var(--accent-soft);
    color: var(--accent);
    border: 1px solid #fde6b8;
    padding: 7px 14px; border-radius: 999px;
    font-size: 14px; font-weight: 800;
    display: flex; align-items: center; gap: 4px;
    letter-spacing: -0.2px;
  }
  .mute-btn {
    position: absolute; top: 19px;
    background: transparent; border: 0;
    color: var(--text-muted); font-size: 16px;
    cursor: pointer; z-index: 6;
  }
  /* 두 토글 (천천히 모드 / 음소거)이 코인 표시 옆에 배치 */
  .mute-btn:nth-of-type(1) { right: 120px; }
  .mute-btn:nth-of-type(2) { right: 90px; }
  .mute-btn.active { color: var(--primary); }

  /* === Home === */
  .home { padding: 4px 20px 24px; overflow-y: auto; flex: 1; }
  .home-title {
    font-size: 22px; font-weight: 800;
    color: var(--text); letter-spacing: -0.7px;
    margin: 18px 0 6px;
  }
  .home-sub {
    color: var(--text-muted); font-size: 13px;
    margin-bottom: 18px; font-weight: 500;
    letter-spacing: -0.2px; line-height: 1.5;
    word-break: keep-all;
  }

  /* === Rank panel === */
  .rank-panel {
    background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
    color: #fff;
    border-radius: var(--radius-lg);
    padding: 18px 20px; margin-bottom: 14px;
    position: relative; overflow: hidden;
    box-shadow: var(--shadow-primary);
  }
  .rank-panel::before {
    content: ''; position: absolute;
    right: -40px; top: -40px;
    width: 160px; height: 160px; border-radius: 50%;
    background: rgba(255, 255, 255, 0.12);
    animation: rankFloat1 7s ease-in-out infinite;
  }
  .rank-panel::after {
    content: ''; position: absolute;
    right: -10px; bottom: -50px;
    width: 100px; height: 100px; border-radius: 50%;
    background: rgba(255, 255, 255, 0.08);
    animation: rankFloat2 6s ease-in-out infinite;
  }
  /* 좌측 하단 작은 원 — 별도 요소로 추가, 다른 위상의 부유 */
  .rank-panel .rank-bubble {
    position: absolute; left: -30px; bottom: -30px;
    width: 90px; height: 90px; border-radius: 50%;
    background: rgba(255, 255, 255, 0.07);
    pointer-events: none;
    animation: rankFloat3 8s ease-in-out infinite;
  }
  @keyframes rankFloat1 {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50%      { transform: translate(-6px, 8px) scale(1.04); }
  }
  @keyframes rankFloat2 {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50%      { transform: translate(8px, -6px) scale(1.06); }
  }
  @keyframes rankFloat3 {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50%      { transform: translate(10px, -10px) scale(1.08); }
  }
  .rank-row { display: flex; align-items: center; gap: 14px; position: relative; }
  .rank-icon-big {
    font-size: 38px; line-height: 1;
    width: 52px; height: 52px;
    background: rgba(255, 255, 255, 0.18);
    border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
    backdrop-filter: blur(8px);
    flex-shrink: 0;
  }
  .rank-text { flex: 1; min-width: 0; }
  .rank-label {
    font-size: 11px; color: rgba(255, 255, 255, 0.7);
    font-weight: 700; letter-spacing: -0.1px;
    margin-bottom: 4px;
  }
  .rank-name {
    font-size: 20px; font-weight: 800;
    color: #fff; letter-spacing: -0.6px;
    line-height: 1.1;
  }
  .rank-bar {
    height: 6px;
    background: rgba(255, 255, 255, 0.2);
    border-radius: 3px; margin-top: 16px; overflow: hidden;
  }
  .rank-bar-fill {
    height: 100%;
    background: #fff;
    border-radius: 3px;
    transition: width .4s cubic-bezier(0.2, 0.9, 0.4, 1);
  }
  .rank-progress-text {
    font-size: 12px; color: rgba(255, 255, 255, 0.85);
    font-weight: 600; margin-top: 8px;
    display: flex; justify-content: space-between;
    letter-spacing: -0.2px;
  }
  .rank-streak {
    display: inline-flex; align-items: center; gap: 5px;
    background: rgba(255, 255, 255, 0.18);
    color: #fff; padding: 4px 10px; border-radius: 999px;
    font-size: 11px; font-weight: 700; margin-top: 8px;
    letter-spacing: -0.1px;
    backdrop-filter: blur(8px);
  }

  /* === Action pills === */
  .home-actions { display: flex; gap: 10px; margin-bottom: 14px; }
  .action-pill {
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px; cursor: pointer;
    display: flex; align-items: center; justify-content: space-between;
    transition: transform .12s, border-color .12s, box-shadow .12s;
  }
  .action-pill:active {
    transform: scale(0.98);
    border-color: var(--primary);
    box-shadow: var(--shadow-sm);
  }
  .action-pill .ap-label {
    font-size: 14px; font-weight: 700;
    color: var(--text); letter-spacing: -0.3px;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .action-pill .ap-val {
    font-size: 12px; font-weight: 700;
    color: var(--text-muted); letter-spacing: -0.2px;
  }

  /* === Daily card === */
  .daily-card {
    display: flex; align-items: center; gap: 14px;
    background: linear-gradient(135deg, var(--accent) 0%, var(--pink) 100%);
    color: #fff;
    padding: 18px 20px; border-radius: var(--radius-lg);
    margin-bottom: 22px; cursor: pointer;
    position: relative; overflow: hidden;
    box-shadow: var(--shadow-accent);
    transition: transform .12s;
  }
  .daily-card:active:not(.done) { transform: scale(0.98); }
  .daily-card::before {
    content: ''; position: absolute;
    right: -30px; top: -30px;
    width: 120px; height: 120px; border-radius: 50%;
    background: rgba(255, 255, 255, 0.15);
  }
  .daily-card.done {
    background: var(--surface-soft);
    color: var(--text-muted);
    cursor: default;
    box-shadow: var(--shadow-sm);
    border: 1px solid var(--border);
  }
  .daily-icon {
    font-size: 30px; line-height: 1; position: relative;
    width: 48px; height: 48px;
    background: rgba(255, 255, 255, 0.22);
    border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
    backdrop-filter: blur(8px);
    flex-shrink: 0;
  }
  .daily-card.done .daily-icon { background: var(--surface); }
  .daily-text { flex: 1; min-width: 0; position: relative; }
  .daily-label {
    font-size: 16px; font-weight: 800;
    color: #fff; letter-spacing: -0.4px;
    margin-bottom: 3px;
  }
  .daily-card.done .daily-label { color: var(--text); }
  .daily-desc {
    font-size: 12px; color: rgba(255, 255, 255, 0.88);
    font-weight: 600; letter-spacing: -0.2px;
    line-height: 1.4;
  }
  .daily-card.done .daily-desc { color: var(--text-muted); }
  /* 약점 단원 / 복습 큐 추천 카드 */
  .recommend-card {
    display: flex; align-items: center; gap: 14px;
    background: var(--surface);
    border: 1.5px solid var(--border);
    padding: 14px 18px; border-radius: var(--radius-lg);
    margin-bottom: 14px; cursor: pointer;
    box-shadow: var(--shadow-sm);
    transition: transform .12s, border-color .15s, background .15s;
  }
  .recommend-card:active { transform: scale(0.98); }
  .recommend-card.weak { border-color: var(--danger); background: linear-gradient(135deg, #fff5f5 0%, #ffe5e5 100%); }
  .recommend-card.review { border-color: var(--primary); background: linear-gradient(135deg, #f3f4ff 0%, #e8e9ff 100%); }
  .recommend-card .rec-icon {
    width: 40px; height: 40px;
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .recommend-card.weak .rec-icon { background: var(--danger-soft); color: var(--danger); }
  .recommend-card.review .rec-icon { background: var(--primary-soft); color: var(--primary); }
  .recommend-card .rec-text { flex: 1; min-width: 0; }
  .recommend-card .rec-label {
    font-size: 14px; font-weight: 800;
    color: var(--text); letter-spacing: -0.3px;
    margin-bottom: 2px;
  }
  .recommend-card .rec-desc {
    font-size: 12px; font-weight: 600;
    color: var(--text-muted); letter-spacing: -0.1px;
  }
  .recommend-card .rec-arrow {
    font-size: 14px; font-weight: 900;
    color: var(--text-muted);
    flex-shrink: 0;
  }
  .recommend-card.weak .rec-arrow { color: var(--danger); }
  .recommend-card.review .rec-arrow { color: var(--primary); }

  .daily-arrow {
    font-size: 18px; font-weight: 900;
    color: #fff; position: relative;
    width: 28px; height: 28px;
    background: rgba(255, 255, 255, 0.18);
    border-radius: 999px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    backdrop-filter: blur(8px);
  }

  /* === 학년 선택 헤더 === */
  .grade-header {
    display: flex; align-items: baseline; justify-content: space-between;
    margin-bottom: 14px;
  }
  .grade-header-title {
    font-size: 18px; font-weight: 800; color: var(--text);
    letter-spacing: -0.5px;
  }
  .grade-header-sub {
    font-size: 12px; color: var(--text-muted); font-weight: 500;
  }

  /* === Grade cards === */
  .grade-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
  .grade-card {
    aspect-ratio: 1 / 1.15;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 16px;
    display: flex; flex-direction: column; justify-content: space-between;
    cursor: pointer;
    box-shadow: var(--shadow-sm);
    transition: transform .15s, border-color .15s, box-shadow .15s;
    position: relative; overflow: hidden;
  }
  .grade-card:active {
    transform: scale(0.97);
    border-color: var(--primary);
    box-shadow: var(--shadow);
  }
  .grade-card.mastered {
    background: linear-gradient(135deg, var(--accent-soft) 0%, var(--surface) 100%);
    border-color: var(--accent);
  }
  .grade-card .stars {
    background: var(--surface-soft);
    color: var(--accent);
    border: 1px solid var(--border);
    font-size: 11px; font-weight: 800;
    padding: 4px 9px; border-radius: 999px;
    align-self: flex-start;
    letter-spacing: -0.1px;
  }
  .grade-card .crown {
    position: absolute; top: 10px; right: 12px;
    font-size: 18px; z-index: 2;
  }
  .grade-card .emoji {
    font-size: 60px; font-weight: 900;
    line-height: 1;
    color: var(--primary);
    letter-spacing: -2px;
  }
  .grade-card .g-text { margin-top: auto; }
  .grade-card .g-name {
    font-size: 17px; font-weight: 800;
    color: var(--text); letter-spacing: -0.4px;
  }
  .grade-card .g-desc {
    font-size: 11px; font-weight: 500;
    color: var(--text-muted); margin-top: 3px;
    line-height: 1.4;
  }
  .grade-card .g-units {
    font-size: 11px; color: var(--primary);
    font-weight: 700;
    margin-top: 8px;
    letter-spacing: -0.1px;
  }

  /* === Unit list === */
  .units { padding: 6px 20px 24px; overflow-y: auto; flex: 1; }
  .unit-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px; margin-bottom: 10px;
    display: flex; align-items: center; gap: 14px;
    cursor: pointer;
    box-shadow: var(--shadow-sm);
    transition: transform .12s, border-color .12s;
    position: relative;
  }
  .unit-card:active {
    transform: scale(0.98);
    border-color: var(--primary);
  }
  .unit-icon {
    width: 46px; height: 46px; border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; flex-shrink: 0;
    background: var(--primary-soft);
  }
  .unit-body { flex: 1; min-width: 0; }
  .unit-name-row {
    display: flex; align-items: center; justify-content: space-between;
    gap: 8px; margin-bottom: 6px;
  }
  .unit-name {
    font-weight: 700; font-size: 15px;
    color: var(--text); letter-spacing: -0.3px;
  }
  .unit-tags { display: flex; gap: 5px; flex-shrink: 0; }
  .unit-tag {
    display: inline-flex; align-items: center;
    font-size: 10px; font-weight: 800;
    padding: 3px 8px; border-radius: 6px;
    letter-spacing: -0.1px;
    white-space: nowrap;
  }
  .unit-tag.boss {
    background: var(--danger-soft); color: var(--danger);
  }
  .unit-tag.timer {
    background: var(--primary-soft); color: var(--primary);
  }
  .unit-tag.perfect {
    background: var(--accent-soft); color: var(--accent);
  }
  .unit-progress-bar {
    height: 5px; background: var(--surface-soft);
    border-radius: 3px; overflow: hidden;
  }
  .unit-progress-fill {
    height: 100%;
    background: var(--primary);
    border-radius: 3px;
    transition: width .4s ease-out;
  }
  .unit-meta {
    font-size: 12px; color: var(--text-muted); margin-top: 7px;
    display: flex; justify-content: space-between; font-weight: 600;
  }
  .unit-stage-label { display: flex; align-items: baseline; gap: 6px; }
  .meta-label { font-size: 10px; color: var(--text-muted); font-weight: 700; letter-spacing: 0.3px; text-transform: uppercase; }
  .meta-value { font-size: 13px; color: var(--text); font-weight: 800; }
  .unit-stars { color: var(--accent); letter-spacing: 1px; font-size: 13px; }

  /* === Play screen === */
  .play { flex: 1; display: flex; flex-direction: column; padding: 14px 20px 18px; overflow: hidden; }
  .hud { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .hearts { font-size: 22px; letter-spacing: 3px; }
  .hearts .lost { opacity: 0.2; filter: grayscale(1); }
  .combo-badge {
    background: linear-gradient(90deg, var(--warn) 0%, var(--accent) 100%);
    color: #fff; font-weight: 800; font-size: 12px;
    padding: 5px 12px; border-radius: 999px;
    box-shadow: var(--shadow-accent);
    letter-spacing: -0.1px;
    opacity: 0; transform: scale(0.8);
    transition: opacity .2s, transform .2s;
  }
  .combo-badge.show { opacity: 1; transform: scale(1); }
  @keyframes comboBeat {
    from { transform: scale(1); }
    to { transform: scale(1.06); }
  }
  .combo-badge.show { animation: comboBeat 0.8s ease-in-out infinite alternate; }

  .progress-dots { display: flex; gap: 6px; justify-content: center; margin-bottom: 14px; }
  .progress-dots .dot {
    width: 26px; height: 5px; border-radius: 3px;
    background: var(--border);
    transition: background .25s;
  }
  .progress-dots .dot.done { background: var(--primary); }
  .progress-dots .dot.wrong { background: var(--danger); }

  /* Boss / Daily banner */
  .boss-banner {
    background: linear-gradient(90deg, var(--danger) 0%, #f87171 50%, var(--danger) 100%);
    color: #fff; text-align: center;
    padding: 9px 14px; border-radius: 12px;
    font-size: 13px; font-weight: 800; letter-spacing: 0.5px;
    margin-bottom: 12px;
    box-shadow: 0 4px 16px rgba(239, 68, 68, 0.3);
  }
  .boss-banner.daily {
    background: linear-gradient(90deg, var(--primary) 0%, var(--secondary) 100%);
    box-shadow: var(--shadow-primary);
  }

  /* Timer bar */
  .timer-bar {
    height: 6px; background: var(--surface-soft);
    border-radius: 3px; overflow: hidden; margin-bottom: 14px;
  }
  .timer-fill {
    height: 100%; width: 100%;
    background: linear-gradient(90deg, var(--success) 0%, var(--accent) 50%, var(--danger) 100%);
    background-size: 200% 100%;
    border-radius: 3px;
  }
  @keyframes countdown {
    0% { width: 100%; background-position: 0% 0%; }
    50% { background-position: 50% 0%; }
    100% { width: 0%; background-position: 100% 0%; }
  }

  /* Problem area */
  .problem-area {
    flex: 1;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 30px 20px; margin-bottom: 12px;
    position: relative; overflow: hidden;
    box-shadow: var(--shadow-sm);
    color: var(--text);
  }
  .problem-area.shake { animation: shake .4s; }
  @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-8px)} 50%{transform:translateX(8px)} 75%{transform:translateX(-4px)} }
  .problem-area.pop { animation: pop .35s; }
  @keyframes pop { 0%{transform:scale(1)} 40%{transform:scale(1.04)} 100%{transform:scale(1)} }
  .problem-area.boss {
    border-color: var(--danger);
    background: linear-gradient(180deg, var(--danger-soft) 0%, var(--surface) 60%);
  }
  .problem-area.danger { animation: dangerPulse 1.2s ease-in-out infinite; }
  @keyframes dangerPulse {
    0%, 100% { box-shadow: var(--shadow-sm); }
    50% { box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.15), var(--shadow-sm); }
  }
  .q-stage {
    font-size: 11px; color: var(--text-muted); margin-bottom: 8px;
    font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase;
  }

  /* 문제용 시각 자료 (도형/분수/시계 등) */
  .problem-visual {
    width: 180px; max-width: 60%;
    margin: 0 auto 14px;
    display: flex; align-items: center; justify-content: center;
    filter: drop-shadow(0 4px 12px rgba(99, 102, 241, 0.15));
  }
  .problem-visual svg { width: 100%; height: auto; display: block; }
  .q-text {
    /* 단일 사이즈 — 짧은 식이든 긴 문장제든 같은 크기로 통일 */
    font-size: 26px;
    font-weight: 800;
    text-align: center; line-height: 1.35;
    color: var(--text);
    margin-bottom: 22px; padding: 0 8px;
    letter-spacing: -0.5px;
    min-height: 2.7em;
    display: flex; align-items: center; justify-content: center;
    flex-wrap: wrap;
    word-break: keep-all;
    gap: 0 2px;
  }
  .q-text.small { font-size: 26px; }
  .answer-box {
    min-width: 130px; min-height: 60px; padding: 10px 22px;
    background: var(--primary-soft);
    border: 2px solid var(--primary);
    border-radius: 14px;
    font-size: 32px; font-weight: 800;
    color: var(--primary);
    display: flex; align-items: center; justify-content: center;
    transition: border-color .15s, background .15s;
    letter-spacing: -1px;
  }
  .answer-box.correct {
    border-color: var(--success);
    background: linear-gradient(135deg, #d1fae5 0%, #a7f3d0 100%);
    color: var(--success);
    box-shadow:
      0 0 0 4px rgba(16, 185, 129, 0.18),
      0 8px 28px rgba(16, 185, 129, 0.35);
    animation: correctFlash .6s cubic-bezier(0.2, 1.3, 0.6, 1);
  }
  @keyframes correctFlash {
    0%   { transform: scale(1); }
    35%  { transform: scale(1.12); }
    100% { transform: scale(1); }
  }
  .answer-box.wrong {
    border-color: var(--danger);
    background: linear-gradient(135deg, var(--danger-soft) 0%, #fecaca 100%);
    color: var(--danger);
    box-shadow:
      0 0 0 4px rgba(239, 68, 68, 0.15),
      0 8px 28px rgba(239, 68, 68, 0.3);
  }
  .feedback {
    position: absolute; bottom: 14px;
    font-size: 17px; font-weight: 900;
    opacity: 0;
    letter-spacing: -0.3px;
    padding: 7px 18px; border-radius: 999px;
    transform: translateY(8px) scale(0.85);
    transition: opacity .25s, transform .35s cubic-bezier(0.2, 1.3, 0.6, 1);
  }
  .feedback.show { opacity: 1; transform: translateY(0) scale(1); }
  .feedback.correct {
    color: #fff;
    background: linear-gradient(90deg, var(--success) 0%, #34d399 100%);
    box-shadow: 0 4px 16px rgba(16, 185, 129, 0.4);
    animation: feedbackBounce .55s cubic-bezier(0.2, 1.3, 0.6, 1);
  }
  .feedback.wrong {
    color: #fff;
    background: linear-gradient(90deg, var(--danger) 0%, #f87171 100%);
    box-shadow: 0 4px 16px rgba(239, 68, 68, 0.35);
  }
  @keyframes feedbackBounce {
    0%   { transform: translateY(20px) scale(0.5); }
    50%  { transform: translateY(-4px) scale(1.1); }
    100% { transform: translateY(0) scale(1); }
  }

  /* Keypad */
  .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .key {
    height: 56px; border: 0; border-radius: 14px;
    font-size: 22px; font-weight: 700; cursor: pointer;
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--border);
    box-shadow: var(--shadow-sm);
    transition: transform .08s, background .1s;
    letter-spacing: -0.5px;
    font-family: inherit;
  }
  .key:active { transform: scale(0.96); background: var(--surface-soft); }
  .key.action {
    background: var(--primary);
    color: #fff;
    border-color: var(--primary-deep);
    box-shadow: var(--shadow-primary);
    font-weight: 800;
  }
  .key.action:active { background: var(--primary-deep); }
  .key.secondary {
    background: var(--surface-soft);
    color: var(--text-soft);
  }
  .key.span3 { grid-column: span 3; }
  .key.frac-key {
    background: var(--primary-soft);
    color: var(--primary);
    font-size: 30px;
    font-weight: 900;
  }

  /* 분수 답 박스 — 분자/분모 분리 표시 */
  .answer-box .frac {
    display: inline-flex; flex-direction: column; align-items: center;
    line-height: 1.0;
    font-size: 28px;
  }
  .answer-box .frac .num {
    border-bottom: 2.5px solid currentColor;
    padding: 0 14px 2px;
    min-width: 24px; text-align: center;
  }
  .answer-box .frac .den {
    padding: 4px 14px 0;
    min-width: 24px; text-align: center;
  }
  .answer-box.fraction { min-height: 78px; padding: 8px 22px; }

  /* 객관식(MCQ) 보기 그리드 */
  .mcq-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
  }
  .mcq-option {
    min-height: 60px; padding: 14px 18px;
    border: 2px solid var(--border);
    border-radius: 16px;
    background: var(--surface);
    color: var(--text);
    font-size: 19px; font-weight: 800;
    cursor: pointer;
    box-shadow: var(--shadow-sm);
    transition: transform .08s, background .12s, border-color .12s;
    font-family: inherit;
    letter-spacing: -0.3px;
    word-break: keep-all;
    line-height: 1.25;
  }
  .mcq-option:active:not(:disabled) {
    transform: scale(0.97);
    background: var(--primary-soft);
    border-color: var(--primary);
  }
  .mcq-option.chosen {
    background: var(--primary-soft);
    border-color: var(--primary);
    color: var(--primary);
  }
  .mcq-option:disabled { cursor: default; opacity: 0.7; }
  .mcq-option.chosen:disabled { opacity: 1; }
  .mcq-option.mcq-correct {
    background: linear-gradient(135deg, #d1fae5 0%, #a7f3d0 100%);
    border-color: var(--success);
    color: var(--success);
    opacity: 1;
  }
  .mcq-option.mcq-wrong {
    background: linear-gradient(135deg, var(--danger-soft) 0%, #fecaca 100%);
    border-color: var(--danger);
    color: var(--danger);
    opacity: 1;
  }

  /* Result */
  .result {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 30px 24px; text-align: center;
  }
  .result .big-emoji {
    font-size: 88px; margin-bottom: 14px;
    animation: bounce .6s;
  }
  @keyframes bounce { 0%{transform:scale(0.3);opacity:0} 60%{transform:scale(1.15)} 100%{transform:scale(1);opacity:1} }
  .result h2 {
    font-size: 30px; margin: 4px 0 6px;
    color: var(--text); font-weight: 900; letter-spacing: -0.8px;
  }
  .result .stage-cleared {
    color: var(--text-muted); font-size: 13px;
    margin-bottom: 20px; font-weight: 600;
    letter-spacing: -0.1px;
  }
  .result .stars-big {
    font-size: 50px; letter-spacing: 8px;
    margin: 14px 0 22px;
  }
  .result .star {
    color: var(--gold);
    filter: drop-shadow(0 4px 12px rgba(251, 191, 36, 0.4));
    display: inline-block;
    opacity: 0;
    transform: scale(0.3) rotate(-180deg);
    animation: starPop 0.55s cubic-bezier(0.2, 1.5, 0.5, 1) forwards;
  }
  .result .stars-big .star:nth-child(1) { animation-delay: 0.2s; }
  .result .stars-big .star:nth-child(2) { animation-delay: 0.45s; }
  .result .stars-big .star:nth-child(3) { animation-delay: 0.7s; }
  .result .star.empty { color: var(--border); filter: none; opacity: 1; transform: none; animation: none; }
  @keyframes starPop {
    0%   { opacity: 0; transform: scale(0.3) rotate(-180deg); }
    60%  { transform: scale(1.3) rotate(15deg); }
    100% { opacity: 1; transform: scale(1) rotate(0deg); }
  }
  .result .reward {
    background: var(--accent-soft);
    border: 1px solid #fde6b8;
    color: var(--accent);
    padding: 12px 22px; border-radius: 12px;
    font-weight: 800; font-size: 14px;
    margin-bottom: 22px; letter-spacing: -0.2px;
  }
  .btn {
    width: 100%; height: 56px; border: 0; border-radius: 14px;
    font-size: 16px; font-weight: 800;
    cursor: pointer; margin-bottom: 10px;
    letter-spacing: -0.3px;
    transition: transform .1s, box-shadow .15s;
    font-family: inherit;
  }
  .btn:active { transform: scale(0.98); }
  .btn.primary {
    background: var(--primary);
    color: #fff;
    box-shadow: var(--shadow-primary);
  }
  .btn.primary:active { background: var(--primary-deep); }
  .btn.ghost {
    background: var(--surface);
    color: var(--text-soft);
    border: 1px solid var(--border);
  }

  /* Confetti */
  .confetti { position: absolute; width: 8px; height: 14px; top: -20px; animation: fall 1.2s linear forwards; border-radius: 2px; }
  @keyframes fall { to { transform: translateY(120vh) rotate(540deg); } }

  /* Perfect banner */
  .perfect-banner {
    background: linear-gradient(90deg, var(--accent) 0%, var(--pink) 100%);
    color: #fff; padding: 6px 18px; border-radius: 999px;
    font-size: 11px; font-weight: 900; letter-spacing: 1.5px;
    margin-bottom: 14px;
    box-shadow: var(--shadow-accent);
  }

  /* Treasure chest */
  .chest {
    font-size: 60px; cursor: pointer; margin: 14px 0;
    animation: chestShake 0.6s ease-in-out infinite alternate;
    transition: transform 0.2s;
    filter: drop-shadow(0 6px 16px rgba(245, 158, 11, 0.4));
  }
  .chest:active { transform: scale(0.92); }
  .chest.opened { animation: none; }
  @keyframes chestShake { 0% { transform: rotate(-4deg); } 100% { transform: rotate(4deg); } }
  .chest-hint {
    font-size: 12px; color: var(--text-muted);
    font-weight: 700; letter-spacing: -0.1px;
  }

  /* Modal */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(20, 25, 50, 0.5);
    backdrop-filter: blur(10px);
    display: flex; align-items: center; justify-content: center;
    z-index: 100;
    animation: fadeIn .3s;
  }
  .rank-up-modal {
    background: var(--surface);
    border-radius: 24px;
    padding: 32px 28px; text-align: center;
    max-width: 86%; width: 340px;
    animation: rankUpPop .5s cubic-bezier(0.2, 1.3, 0.6, 1);
    position: relative; overflow: hidden;
    box-shadow: var(--shadow-lg);
    color: var(--text);
  }
  @keyframes rankUpPop { 0% { transform: scale(0.3); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
  .rank-up-modal::before {
    content: ''; position: absolute;
    top: -100px; left: 50%; transform: translateX(-50%);
    width: 300px; height: 200px;
    background: radial-gradient(ellipse, var(--rank-color, var(--primary)) 0%, transparent 60%);
    opacity: 0.2;
  }
  .rank-up-modal .label {
    font-size: 12px; color: var(--rank-color, var(--primary));
    font-weight: 800; letter-spacing: 2px;
    position: relative; text-transform: uppercase;
  }
  .rank-up-modal .big-icon {
    font-size: 80px; margin: 14px 0 8px;
    position: relative;
    animation: rankIconSpin 1s ease;
  }
  @keyframes rankIconSpin { 0% { transform: rotateY(0); } 100% { transform: rotateY(360deg); } }
  .rank-up-modal .rank-title {
    font-size: 28px; font-weight: 900;
    color: var(--text); letter-spacing: -0.8px;
    margin-bottom: 6px; position: relative;
  }
  .rank-up-modal .rank-sub {
    font-size: 14px; color: var(--text-muted);
    margin-bottom: 24px; position: relative;
    font-weight: 500;
  }
  .rank-up-modal .close-btn {
    width: 100%; height: 50px; padding: 0 20px;
    border: 0; border-radius: 14px;
    background: var(--rank-color, var(--primary));
    color: #fff;
    font-weight: 800; font-size: 15px; cursor: pointer;
    letter-spacing: -0.2px; position: relative;
    text-align: center; font-family: inherit;
    box-shadow: var(--shadow-primary);
  }

  /* Badge toast */
  .badge-toast {
    position: absolute; top: 14px; left: 50%;
    transform: translateX(-50%) translateY(-80px);
    background: var(--surface);
    color: var(--text);
    padding: 10px 18px; border-radius: 14px;
    display: flex; align-items: center; gap: 10px;
    border: 1px solid var(--border);
    box-shadow: var(--shadow-lg);
    z-index: 50; pointer-events: none;
    opacity: 0;
    transition: transform .35s cubic-bezier(0.2, 1.3, 0.6, 1), opacity .35s;
    font-size: 13px; font-weight: 700;
    white-space: nowrap;
  }
  .badge-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .badge-toast .bt-icon { font-size: 24px; }
  .badge-toast .bt-text { display: flex; flex-direction: column; gap: 1px; }
  .badge-toast .bt-label {
    font-size: 10px; color: var(--accent);
    font-weight: 800; letter-spacing: 1px;
    text-transform: uppercase;
  }

  /* Badges grid */
  .badges-grid {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
    padding: 6px 20px 24px;
    overflow-y: auto; flex: 1;
  }
  .badge-card {
    aspect-ratio: 1 / 1.2;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 10px 8px; text-align: center;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 4px;
    position: relative;
    color: var(--text);
    box-shadow: var(--shadow-sm);
  }
  .badge-card.unlocked {
    border-color: var(--accent);
    background: linear-gradient(135deg, var(--accent-soft) 0%, var(--surface) 100%);
  }
  .badge-card.locked { opacity: 0.5; }
  .badge-card .b-icon { font-size: 30px; line-height: 1; }
  .badge-card .b-name {
    font-size: 12px; font-weight: 700;
    color: var(--text); letter-spacing: -0.2px;
  }
  .badge-card .b-desc {
    font-size: 10px; color: var(--text-muted);
    line-height: 1.3; font-weight: 500;
  }
  .badge-card.locked .b-lock {
    position: absolute; top: 6px; right: 6px; font-size: 12px;
    color: var(--text-muted);
  }

  /* === 숫자 표 형식 === */
  .topbar .coins, .rank-progress-text, .unit-meta, .stars,
  .ap-val, .answer-box, .q-text, .key, .badge-card .b-name {
    font-variant-numeric: tabular-nums lining-nums;
  }
  .coin-suffix {
    font-size: 0.72em; font-weight: 700;
    margin-left: 3px; opacity: 0.7;
    letter-spacing: 0;
  }

  /* === 수학 문제 분수 / 연산자 === */
  .frac {
    display: inline-flex; flex-direction: column;
    vertical-align: middle; margin: 0 4px;
    font-size: 0.78em;
    line-height: 1.05;
  }
  .frac-num, .frac-den {
    padding: 0 4px; text-align: center;
    font-weight: 800;
    min-width: 1ch;
  }
  .frac-num { border-bottom: 2px solid currentColor; padding-bottom: 1px; }
  .frac-den { padding-top: 2px; }
  /* 연산자: 부모와 같은 size 유지 */
  .op {
    color: var(--primary); font-weight: 900;
    margin: 0 6px; font-size: 1em;
  }
  .op-eq {
    color: var(--text-muted); font-weight: 800;
    margin: 0 8px; font-size: 1em;
  }
  .qmark {
    color: var(--accent); font-weight: 900;
    font-size: 1em;
  }

  /* === 한국어 줄바꿈 === */
  .home-sub, .daily-desc, .rank-progress-text,
  .stage-cleared, .b-desc { word-break: keep-all; line-height: 1.45; }

  /* === SVG 아이콘 inline 정렬 === */
  .ico {
    display: inline-block;
    vertical-align: -3px;
    flex-shrink: 0;
  }
  .topbar .back .ico, .mute-btn .ico { vertical-align: middle; }
  .ap-label .ico { vertical-align: -3px; margin-right: 4px; color: var(--primary); }
  .daily-icon .ico { color: #fff; }
  .daily-card.done .daily-icon .ico { color: var(--success); }
  .rank-streak .ico { vertical-align: -2px; color: #ffaa3a; }
  .reward .ico { vertical-align: -3px; margin-right: 4px; color: var(--accent); }
  .combo-badge .ico { vertical-align: -2px; }
  .boss-banner .ico { vertical-align: -2px; }
  /* 단원 아이콘 inline 색상 (인디고 액센트) */
  .unit-icon .ico { color: var(--primary); }
  .unit-card[style*="--unit-accent"] .unit-icon .ico { color: var(--unit-accent, var(--primary)); }
  /* 별 SVG 색상 */
  .stars-big .star .ico { color: var(--gold); }
  .stars-big .star.empty .ico { color: var(--border); }
  /* 하트 SVG 색상 */
  .hearts .heart .ico { color: var(--danger); }
  .hearts .heart.lost .ico { color: var(--border); }
  /* 결과 큰 아이콘 */
  .big-icon-wrap {
    display: flex; align-items: center; justify-content: center;
    width: 110px; height: 110px;
    border-radius: 50%;
    margin-bottom: 14px;
    animation: bounce .6s;
  }
  .big-icon-wrap.success {
    background: var(--accent-soft);
    color: var(--accent);
    box-shadow: 0 8px 28px rgba(245, 158, 11, 0.3);
  }
  .big-icon-wrap.fail {
    background: var(--surface-soft);
    color: var(--text-muted);
  }
  .crown .ico { color: var(--accent); }

  /* === Splash 화면 (앱 첫 로딩) === */
  .splash {
    position: fixed; inset: 0;
    background: linear-gradient(135deg, #fafaff 0%, #eef0ff 100%);
    display: flex; align-items: center; justify-content: center;
    z-index: 1000;
    transition: opacity .5s, transform .5s;
  }
  .splash.fade { opacity: 0; transform: scale(0.96); pointer-events: none; }
  .splash-inner {
    display: flex; flex-direction: column; align-items: center;
    animation: splashIn .65s cubic-bezier(0.2, 1.3, 0.6, 1);
  }
  @keyframes splashIn {
    from { opacity: 0; transform: translateY(16px) scale(0.85); }
    to { opacity: 1; transform: none; }
  }
  .splash .logo-mark {
    filter: drop-shadow(0 12px 32px rgba(99, 102, 241, 0.35));
    animation: splashFloat 2s ease-in-out infinite alternate;
  }
  @keyframes splashFloat {
    from { transform: translateY(0); }
    to { transform: translateY(-6px); }
  }
  .splash-title {
    font-size: 32px; font-weight: 900;
    letter-spacing: -1px;
    margin-top: 16px;
    background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .splash-sub {
    font-size: 14px; font-weight: 600;
    color: var(--text-muted);
    margin-top: 4px; letter-spacing: -0.2px;
  }

  /* === Answer box 펄스 === */
  .answer-box:not(.correct):not(.wrong) {
    animation: ansPulse 2s ease-in-out infinite;
  }
  @keyframes ansPulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(99, 102, 241, 0); }
    50% { box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1); }
  }

  /* === 오답 시 풀이 카드 (공식/풀이/답 3단) === */
  .explanation-card {
    position: absolute;
    bottom: 14px; left: 14px; right: 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-left: 4px solid var(--primary);
    border-radius: 14px;
    padding: 14px 16px;
    box-shadow: var(--shadow-lg);
    opacity: 0;
    transform: translateY(20px);
    transition: opacity .3s, transform .35s cubic-bezier(0.2, 1.3, 0.6, 1);
    z-index: 5;
    text-align: left;
    max-height: 60%;
    overflow-y: auto;
  }
  .explanation-card.show { opacity: 1; transform: translateY(0); }

  /* 카드 위쪽 헤더 라벨 */
  .explanation-card::before {
    content: '📘 풀이';
    display: block;
    font-size: 11px; font-weight: 800;
    color: var(--primary);
    letter-spacing: 1px; text-transform: uppercase;
    margin-bottom: 8px;
  }

  /* 한 줄 = 라벨 (공식/풀이/답) + 내용 */
  .exp-row {
    display: flex; align-items: flex-start; gap: 10px;
    padding: 6px 0;
    border-top: 1px dashed var(--border-soft);
  }
  .exp-row:first-of-type { border-top: 0; padding-top: 0; }
  .exp-tag {
    flex-shrink: 0;

<body>
<div id="app"></div>

<script>
/* ============================================================
   Math Quest — 초등 수학 게임 앱
   단일 파일 버전. 문제는 매 플레이마다 생성기에서 새로 생성됨.
   스테이지가 올라갈수록 숫자 범위·스텝 수가 늘어나 난이도 상승.
   ============================================================ */

// ---------- Utilities ----------
const rand = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;
const pick = arr => arr[rand(0, arr.length - 1)];
const gcd = (a, b) => { a = Math.abs(a); b = Math.abs(b); while (b) [a, b] = [b, a % b]; return a || 1; };
function reduceFrac(n, d) {
  const g = gcd(n, d);
  return [n / g, d / g];
}
function fracStr(n, d) {
  [n, d] = reduceFrac(n, d);
  if (d === 1) return String(n);
  return `${n}/${d}`;
}
function roundDec(x, p = 2) {
  const m = Math.pow(10, p);
  return Math.round(x * m) / m;
}

// ---------- Answer comparison ----------
// Handles: integers, decimals (tolerance), fractions "a/b", mixed numbers "a b/c"
function parseAnswer(s) {
  if (s == null) return null;
  s = String(s).trim().replace(/\s+/g, ' ');
  if (s === '') return null;
  // Mixed number: "1 1/2"
  const mix = s.match(/^(-?\d+)\s+(\d+)\/(\d+)$/);
  if (mix) {
    const whole = +mix[1], n = +mix[2], d = +mix[3];
    if (d === 0) return null;
    const sign = whole < 0 ? -1 : 1;
    return { kind: 'frac', value: sign * (Math.abs(whole) * d + n) / d, num: sign * (Math.abs(whole) * d + n), den: d };
  }
  // Fraction "a/b"
  const fm = s.match(/^(-?\d+)\/(\d+)$/);
  if (fm) {
    const n = +fm[1], d = +fm[2];
    if (d === 0) return null;
    return { kind: 'frac', value: n / d, num: n, den: d };
  }
  // Number (int or decimal)
  if (/^-?\d+(\.\d+)?$/.test(s)) {
    return { kind: 'num', value: parseFloat(s) };
  }
  return null;
}

function checkAnswer(userStr, expected) {
  const u = parseAnswer(userStr);
  const e = parseAnswer(String(expected));
  // 둘 다 숫자/분수로 파싱되면 수치 비교
  if (u && e) return Math.abs(u.value - e.value) < 1e-6;
  // 텍스트 답(객관식 한글 보기 등): NFC 정규화 후 정확 일치
  const norm = s => String(s).trim().normalize('NFC');
  return norm(userStr) === norm(expected);
}

// 답의 형식 판별 — 키패드/입력 UI 결정에 사용
function answerKind(problem) {
  if (problem && problem.choices) return 'mcq';
  const s = String(problem && problem.a !== undefined ? problem.a : problem);
  if (s.includes('/')) return 'fraction';
  if (s.includes('.')) return 'decimal';
  return 'integer';
}

// 객관식 보기 셔플 — 정답 + 오답 후보를 받아 4개 보기 배열을 셔플해서 반환
function mcqChoices(correct, distractors) {
  const seen = new Set([String(correct)]);
  const out = [correct];
  for (const d of distractors) {
    const k = String(d);
    if (!seen.has(k)) { seen.add(k); out.push(d); }
    if (out.length >= 4) break;
  }
  // 셔플
  for (let i = out.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [out[i], out[j]] = [out[j], out[i]];
  }
  return out;
}

// ============================================================
// 문제 생성기 — 각 단원마다 generate(stage) 함수 제공
// stage는 1부터 시작. 숫자 상한·연산 횟수 등이 stage에 비례하여 증가.
// ============================================================

const GRADES = {
  1: {
    name: "1학년",
    emoji: "1",
    color: "#3b82f6",
    desc: "기초 덧셈·뺄셈, 50까지의 수",
    units: [
      {
        id: "g1-add10", name: "10까지 덧셈", icon: "➕", color: "#ffd9e0",
        generate(stage) {
          // Phase 진화: 1~3 기본 / 4~6 큰 숫자 / 7~9 빈칸 / 10~12 받아올림 / 13+ 세 수
          if (stage <= 3) {
            const max = 2 + stage;
            const a = rand(1, max);
            const b = rand(1, Math.min(max, 10 - a));
            return { q: `${a} + ${b} = ?`, a: a + b };
          }
          if (stage <= 6) {
            const a = rand(2, 9);
            const b = rand(1, Math.min(9, 10 - a));
            return { q: `${a} + ${b} = ?`, a: a + b };
          }
          if (stage <= 9) {
            // 빈칸 위치 변환: a + ? = c
            const a = rand(2, 7);
            const ans = rand(1, 9 - a);
            return { q: `${a} + ? = ${a + ans}`, a: ans };
          }
          if (stage <= 12) {
            // 받아올림 (합 11~18)
            const a = rand(5, 9);
            const b = rand(Math.max(2, 11 - a), 9);
            return { q: `${a} + ${b} = ?`, a: a + b };
          }
          // 세 수 합 (10 이내)
          const a = rand(1, 4), b = rand(1, 4), c = rand(1, Math.min(5, 10 - a - b));
          return { q: `${a} + ${b} + ${c} = ?`, a: a + b + c };
        }
      },
      {
        id: "g1-sub10", name: "10까지 뺄셈", icon: "➖", color: "#ffe7d1",
        generate(stage) {
          // Phase: 1~3 기본 / 4~6 더 큰 / 7~9 빈칸 / 10~12 받아내림(20에서) / 13+ 세 수 뺄셈
          if (stage <= 3) {
            const a = rand(3, 5 + stage);
            const b = rand(1, a - 1);
            return { q: `${a} - ${b} = ?`, a: a - b };
          }
          if (stage <= 6) {
            const a = rand(5, 10);
            const b = rand(1, a - 1);
            return { q: `${a} - ${b} = ?`, a: a - b };
          }
          if (stage <= 9) {
            // 빈칸: a - ? = c
            const a = rand(5, 10);
            const ans = rand(1, a - 1);
            return { q: `${a} - ? = ${a - ans}`, a: ans };
          }
          if (stage <= 12) {
            // 십몇 - 한 자리 (받아내림)
            const a = rand(11, 18);
            const b = rand(a - 9, 9);
            return { q: `${a} - ${b} = ?`, a: a - b };
          }
          // 세 수: a - b - c
          const a = rand(8, 15);
          const b = rand(1, Math.floor(a / 2));
          const c = rand(1, Math.max(1, a - b - 1));
          return { q: `${a} - ${b} - ${c} = ?`, a: a - b - c };
        }
      },
      {
        id: "g1-add20", name: "20까지 덧셈", icon: "🔟", color: "#ffd6b0",
        generate(stage) {
          // Phase: 1~3 합 11~14 / 4~6 11~17 / 7~9 빈칸 / 10~12 합 18~20 / 13+ 두자리 + 한자리
          if (stage <= 3) {
            const a = rand(7, 9), b = rand(11 - a, 14 - a);
            return { q: `${a} + ${b} = ?`, a: a + b };
          }
          if (stage <= 6) {
            const a = rand(5, 9), b = rand(Math.max(2, 11 - a), Math.min(9, 17 - a));
            return { q: `${a} + ${b} = ?`, a: a + b };
          }
          if (stage <= 9) {
            const a = rand(5, 9), ans = rand(11 - a, Math.min(9, 17 - a));
            return { q: `${a} + ? = ${a + ans}`, a: ans };
          }
          if (stage <= 12) {
            const a = rand(8, 9), b = rand(11 - a, Math.min(9, 20 - a));
            return { q: `${a} + ${b} = ?`, a: a + b };
          }
          // 두 자리 + 한 자리 (합 ≤ 30)
          const a = rand(11, 19), b = rand(2, Math.min(9, 30 - a));
          return { q: `${a} + ${b} = ?`, a: a + b };
        }
      },
      {
        id: "g1-sub20", name: "20까지 뺄셈", icon: "💫", color: "#f7d6ff",
        generate(stage) {
          if (stage <= 3) {
            const a = rand(11, 14), b = rand(2, Math.min(9, a - 5));
            return { q: `${a} - ${b} = ?`, a: a - b };
          }
          if (stage <= 6) {
            const a = rand(11, 17), b = rand(a - 9, 9);
            return { q: `${a} - ${b} = ?`, a: a - b };
          }
          if (stage <= 9) {
            const a = rand(11, 17), ans = rand(1, 9);
            const b = a - ans;
            return { q: `${a} - ? = ${ans}`, a: b };
          }
          if (stage <= 12) {
            const a = rand(15, 20), b = rand(a - 9, 9);
            return { q: `${a} - ${b} = ?`, a: a - b };
          }
          // 두 자리 - 한 자리 (받아내림 다양)
          const a = rand(20, 30), b = rand(2, 9);
          return { q: `${a} - ${b} = ?`, a: a - b };
        }
      },
      {
        id: "g1-num50", name: "50까지의 수", icon: "🔢", color: "#d6edff",
        generate(stage) {
          const cap = Math.min(50, 20 + stage * 5);
          const forms = [
            () => {
              const tens = rand(1, Math.floor(cap / 10));
              const ones = rand(1, 9); // 0개 표현 회피 (1학년 학습자 혼란 방지)
              return { q: `10이 ${tens}개, 1이 ${ones}개인 수는?`, a: tens * 10 + ones };
            },
            () => {
              const n = rand(10, cap);
              return { q: `${n}에서 1 큰 수는?`, a: n + 1 };
            },
            () => {
              const n = rand(11, cap);
              return { q: `${n}보다 1 작은 수는?`, a: n - 1 };
            },
          ];
          return pick(forms)();
        }
      },
      {
        id: "g1-mixed", name: "덧셈·뺄셈 혼합", icon: "🎲", color: "#e0d6ff",
        generate(stage) {
          const max = Math.min(10, 5 + stage);
          const a = rand(3, max);
          const b = rand(1, max - 1);
          const c = rand(1, Math.min(5, max));
          const ops = rand(0, 1) === 0 ? ['+','-'] : ['-','+'];
          let v = a;
          v = ops[0] === '+' ? v + b : v - b;
          if (v < 0) return this.generate(stage);
          v = ops[1] === '+' ? v + c : v - c;
          if (v <= 0) return this.generate(stage); // 0/음수 답 회피
          return { q: `${a} ${ops[0]} ${b} ${ops[1]} ${c} = ?`, a: v };
        }
      },
      {
        id: "g1-pattern", name: "규칙 찾기", icon: "🔁", color: "#ffe8c6",
        generate(stage) {
          // Phase: 1~3 단순 / 4~6 거꾸로 / 7~9 ABAB 패턴 / 10~12 큰 step / 13+ 두 step 변환
          if (stage <= 3) {
            const start = rand(1, 5);
            const step = 1;
            return { q: `${start}, ${start+step}, ${start+2*step}, ?, ${start+4*step} 의 ?는?`, a: start + 3*step };
          }
          if (stage <= 6) {
            const step = rand(1, 2);
            const start = 3*step + rand(5, 10);
            return { q: `${start}, ${start-step}, ${start-2*step}, ? (거꾸로)`, a: start - 3*step };
          }
          if (stage <= 9) {
            let x = rand(1, 9), y = rand(1, 9);
            while (y === x) y = rand(1, 9);
            return { q: `${x}, ${y}, ${x}, ${y}, ${x}, ? 에 들어갈 수는?`, a: y };
          }
          if (stage <= 12) {
            const start = rand(2, 8);
            const step = rand(2, 4);
            return { q: `${start}, ${start+step}, ${start+2*step}, ${start+3*step}, ? (같은 규칙)`, a: start + 4*step };
          }
          // ABCABC 패턴
          const a = rand(1, 5), b = rand(1, 5), c = rand(1, 5);
          if (a === b || b === c || a === c) return this.generate(stage);
          return { q: `${a}, ${b}, ${c}, ${a}, ${b}, ? (반복 규칙)`, a: c };
        }
      },
      {
        id: "g1-shape", name: "모양 알아보기", icon: "🔺", color: "#d4f4ff",
        generate(stage) {
          // 1학년: 도형 이름 인식 → 변·꼭짓점 세기
          const items = [
            { name: "삼각형", sides: 3, visual: { type: 'polygon', n: 3 } },
            { name: "사각형", sides: 4, visual: { type: 'polygon', n: 4 } },
            { name: "원",     sides: 0, visual: { type: 'circle', hideLabel: true } },
            { name: "오각형", sides: 5, visual: { type: 'polygon', n: 5 } },
            { name: "육각형", sides: 6, visual: { type: 'polygon', n: 6 } },
          ];
          const polys = items.filter(x => x.sides > 0);
          const askName = () => {
            const pool = stage <= 3 ? items.slice(0, 3) : items;
            const s = pick(pool);
            const distractors = items.filter(x => x.name !== s.name).map(x => x.name);
            return { q: '이 도형의 이름은?', a: s.name, choices: mcqChoices(s.name, distractors), visual: s.visual };
          };
          const askSides = () => {
            const s = pick(polys);
            return { q: '이 도형의 변은 몇 개?', a: s.sides, visual: { ...s.visual, highlight: 'sides' } };
          };
          const askVertices = () => {
            const s = pick(polys);
            return { q: '이 도형의 꼭짓점은 몇 개?', a: s.sides, visual: { ...s.visual, highlight: 'vertices' } };
          };

          if (stage <= 3) return askName();
          if (stage <= 6) return askName();
          if (stage <= 9) {
            // 보스 등 다양성 필요 시 이름 인식도 섞기
            return pick([askSides, askName])();
          }
          // stage 10+: 꼭짓점 + 변 + 이름 모두 섞어 출제
          return pick([askVertices, askSides, askName])();
        }
      },
    ]
  },

  2: {
    name: "2학년",
    emoji: "2",
    color: "#10b981",
    desc: "세 자리 수, 구구단, 시각과 시간",
    units: [
      {
        id: "g2-add2", name: "두 자리 덧셈", icon: "➕", color: "#ffeac6",
        generate(stage) {
          const cap = Math.min(99, 20 + stage * 10);
          const a = rand(10, cap);
          const b = rand(10, cap);
          return { q: `${a} + ${b} = ?`, a: a + b };
        }
      },
      {
        id: "g2-sub2", name: "두 자리 뺄셈", icon: "➖", color: "#ffcfc6",
        generate(stage) {
          const cap = Math.min(99, 30 + stage * 10);
          const a = rand(20, cap);
          const b = rand(10, a - 1);
          return { q: `${a} - ${b} = ?`, a: a - b };
        }
      },
      {
        id: "g2-num3", name: "세 자리 수", icon: "🔢", color: "#cfe6ff",
        generate(stage) {
          const forms = [
            () => {
              const h = rand(1, 9), t = rand(0, 9), o = rand(0, 9);
              return { q: `백의 자리 ${h}, 십의 자리 ${t}, 일의 자리 ${o}인 수는?`, a: h*100 + t*10 + o };
            },
            () => {
              const n = rand(100, 999);
              const pos = pick(['백', '십', '일']);
              const d = pos === '백' ? Math.floor(n/100) : pos === '십' ? Math.floor(n/10)%10 : n%10;
              return { q: `${n}에서 ${pos}의 자리 숫자는?`, a: d };
            },
            () => {
              const n = rand(100, 899);
              return { q: `${n}보다 100 큰 수는?`, a: n + 100 };
            },
          ];
          return pick(forms)();
        }
      },
      {
        id: "g2-mul", name: "구구단", icon: "✖️", color: "#ffe0f5",
        generate(stage) {
          // Phase 1~3: 2,5단 / 4~6: 3,4,6단 / 7~9: 7,8,9단 / 10~12: 빈칸 / 13+: 거꾸로 (몫 찾기)
          if (stage <= 3) {
            const a = pick([2, 5]);
            const b = rand(2, 9);
            return { q: `${a} × ${b} = ?`, a: a * b };
          }
          if (stage <= 6) {
            const a = pick([3, 4, 6]);
            const b = rand(2, 9);
            return { q: `${a} × ${b} = ?`, a: a * b };
          }
          if (stage <= 9) {
            const a = pick([7, 8, 9]);
            const b = rand(2, 9);
            return { q: `${a} × ${b} = ?`, a: a * b };
          }
          if (stage <= 12) {
            // 빈칸: a × ? = c
            const a = rand(2, 9), ans = rand(2, 9);
            return { q: `${a} × ? = ${a * ans}`, a: ans };
          }
          // 큰 곱셈 두 자리 × 한 자리
          const a = rand(11, 20), b = rand(2, 9);
          return { q: `${a} × ${b} = ?`, a: a * b };
        }
      },
      {
        id: "g2-length", name: "길이 재기", icon: "📏", color: "#d9f5d4",
        generate(stage) {
          const forms = [
            () => {
              const m = rand(1, 5), cm = rand(1, 99);
              return { q: `${m}m ${cm}cm = ? cm`, a: m * 100 + cm };
            },
            () => {
              const cm = rand(101, 500);
              return { q: `${cm}cm는 몇 m 몇 cm일까요? (m만)`, a: Math.floor(cm / 100) };
            },
          ];
          return pick(forms)();
        }
      },
      {
        id: "g2-time", name: "시각과 시간", icon: "⏰", color: "#fff3b0",
        generate(stage) {
          const forms = [
            () => {
              const h = rand(1, 5), m = rand(1, 5);
              return { q: `${h}시간 ${m*10}분 = ? 분`, a: h * 60 + m * 10 };
            },
            () => {
              const m = rand(7, 12) * 10;
              return { q: `${m}분 = 1시간 ? 분`, a: m - 60 };
            },
            () => {
              const h = rand(1, 8);
              return { q: `오전 ${h}시에서 2시간 후는 오전 몇 시?`, a: h + 2 };
            },
            () => {
              const h = rand(1, 12);
              return { q: `시계가 가리키는 시각은 몇 시?`, a: h, visual: { type: 'clock', h, m: 0 } };
            },
            () => {
              const h = rand(1, 12), m = pick([15, 30, 45]);
              return { q: `시계가 가리키는 분은?`, a: m, visual: { type: 'clock', h, m } };
            },
          ];
          return pick(forms)();
        }
      },
      {
        id: "g2-pattern", name: "규칙 찾기", icon: "🔁", color: "#d9e6ff",
        generate(stage) {
          const r1 = () => {
            const start = rand(2, 10);
            const step = rand(2, Math.min(5, 2 + Math.floor(stage/2)));
            return { q: `${start}, ${start+step}, ${start+2*step}, ${start+3*step}, ? (같은 규칙)`, a: start + 4*step };

// 사운드 (Web Audio API, 외부 파일 불필요)
// ============================================================
let audioCtx = null;
function ensureAudio() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    catch { return null; }
  }
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}
function playTone(freq, duration = 100, type = 'sine', gain = 0.08) {
  if (SAVE.muted) return;
  const ctx = ensureAudio(); if (!ctx) return;
  const osc = ctx.createOscillator();
  const g = ctx.createGain();
  osc.type = type;
  osc.frequency.value = freq;
  g.gain.setValueAtTime(gain, ctx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration/1000);
  osc.connect(g).connect(ctx.destination);
  osc.start();
  osc.stop(ctx.currentTime + duration/1000);
}
function playCorrect() { playTone(880, 70); setTimeout(() => playTone(1320, 90), 70); }
function playWrong()   { playTone(220, 180, 'sawtooth', 0.06); }
function playCombo(level) {
  const notes = [659, 784, 988, 1175, 1397];
  for (let i = 0; i < Math.min(level, notes.length); i++) {
    setTimeout(() => playTone(notes[i], 80, 'triangle'), i * 55);
  }
}
function playRankUp() {
  const notes = [523, 659, 784, 1047, 1319, 1568];
  notes.forEach((n, i) => setTimeout(() => playTone(n, 180, 'triangle', 0.11), i * 120));
}

}

}

function todayStr() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function daysBetween(a, b) {
  if (!a || !b) return null;
  const da = new Date(a + 'T00:00:00');
  const db = new Date(b + 'T00:00:00');
  return Math.round((db - da) / (1000 * 60 * 60 * 24));
}

function loadSave() {
  const defaults = {
    coins: 0, units: {}, badges: [], muted: false,
    relaxedMode: false, // 천천히 모드 — 시간 제한 비활성, 시간 보너스만 적용
    lastPlayDate: '', streak: 0,
    dailyChallenge: { date: '', completed: false }, // 오늘 데일리 챌린지 완료 여부
    reviewQueue: [], // 오답 복습 큐: { unitId, q, a, choices, visual, attempts, addedAt }
    stats: {
      correctCount: 0, maxCombo: 0, perfectStages: 0, totalStars: 0,
      chestsOpened: 0, gradesPlayed: [],
      bossDefeats: 0, bossPerfects: 0,
      fastAnswers: 0,        // 3초 내 정답 누적
      dailyCompletions: 0    // 데일리 챌린지 누적 클리어
    }
  };
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return defaults;
    const s = JSON.parse(raw);
    return { ...defaults, ...s,
      dailyChallenge: { ...defaults.dailyChallenge, ...(s.dailyChallenge || {}) },
      stats: { ...defaults.stats, ...(s.stats || {}) },
      badges: s.badges || [] };
  } catch { return defaults; }
}
function saveSave(s) {
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(s)); } catch {}
}
let SAVE = loadSave();

function getUnitProgress(unitId) {
  return SAVE.units[unitId] || { stage: 1, stars: 0, attempts: 0, correct: 0, consecutiveFails: 0 };
}
function setUnitProgress(unitId, data) {
  SAVE.units[unitId] = { ...getUnitProgress(unitId), ...data };
  saveSave(SAVE);
}

// ---------- 격려 메시지 (정답 시) ----------
function pickEncouragement(combo, elapsedSec) {
  // 빠른 정답
  if (elapsedSec < 3 && combo >= 3) return '⚡ 번개 같아!';
  if (elapsedSec < 3) return '⚡ 빠르네!';
  // 콤보별 메시지
  if (combo >= 10) return '🔥 10연속 대단해!';
  if (combo >= 7) return '🔥 멈출 수가 없어!';
  if (combo >= 5) return '✨ 5연속 정답!';
  if (combo >= 3) return '👏 잘하고 있어!';
  // 일반 정답 — 다양한 메시지 중 랜덤
  const msgs = ['🎉 정답!', '👍 좋아요!', '✅ 맞았어요!', '⭐ 완벽해!', '🌟 잘했어!'];
  return msgs[Math.floor(Math.random() * msgs.length)];
}

// ---------- 오답 복습 큐 (간격 반복 학습) ----------
const REVIEW_QUEUE_MAX = 30;
function addToReviewQueue(unitId, problem) {
  if (!problem || !problem.q || problem.a == null) return;
  // 중복 제거 (같은 단원·질문·답·시각자료)
  const key = unitId + '|' + problem.q + '|' + String(problem.a);
  SAVE.reviewQueue = SAVE.reviewQueue.filter(r =>
    (r.unitId + '|' + r.q + '|' + String(r.a)) !== key);
  SAVE.reviewQueue.push({
    unitId, q: problem.q, a: problem.a,
    choices: problem.choices || null,
    visual: problem.visual || null,
    attempts: 0, addedAt: Date.now(),
  });
  // 큐 크기 제한 (오래된 것부터 제거)
  while (SAVE.reviewQueue.length > REVIEW_QUEUE_MAX) SAVE.reviewQueue.shift();
  saveSave(SAVE);
}
function takeReviewProblems(unitId, n) {
  // 같은 단원의 큐 문제를 최대 n개 꺼냄 (큐에선 제거하지 않음 — 정답 시 별도 처리)
  const items = SAVE.reviewQueue.filter(r => r.unitId === unitId).slice(0, n);
  return items.map(r => ({
    q: r.q, a: r.a,
    choices: r.choices, visual: r.visual,
    __review: true,  // 마커: 복습 문제임을 식별
  }));
}
function markReviewSolved(unitId, problem) {
  // 정답 시: attempts++, 3회 이상 통과면 큐에서 제거
  const key = unitId + '|' + problem.q + '|' + String(problem.a);
  const idx = SAVE.reviewQueue.findIndex(r =>
    (r.unitId + '|' + r.q + '|' + String(r.a)) === key);
  if (idx === -1) return;
  SAVE.reviewQueue[idx].attempts = (SAVE.reviewQueue[idx].attempts || 0) + 1;
  if (SAVE.reviewQueue[idx].attempts >= 3) SAVE.reviewQueue.splice(idx, 1);
  saveSave(SAVE);
}

// ---------- 단원별 정답률 / 약점 단원 추천 ----------
function getUnitAccuracy(unitId) {
  const p = getUnitProgress(unitId);
  if (!p.attempts) return null;
  return p.correct / p.attempts;
}
function getWeakUnit() {
  // 한 번 이상 풀어봤지만 정답률이 낮은 단원 (50회 미만 시도면 미숙으로 간주)
  let worst = null;
  for (const [grade, info] of Object.entries(GRADES)) {
    for (const unit of info.units) {
      const p = getUnitProgress(unit.id);
      if (!p.attempts || p.attempts < 5) continue;
      const acc = p.correct / p.attempts;
      if (acc >= 0.85) continue; // 잘하는 단원 제외
      if (!worst || acc < worst.acc) worst = { unit, grade, acc, p };
    }
  }
  return worst;
}

// ---------- 랭크 ----------
function getCurrentRank() {
  let current = RANKS[0];
  for (const r of RANKS) if (SAVE.coins >= r.min) current = r; else break;
  return current;
}
function getNextRank() {
  const cur = getCurrentRank();
  return RANKS[cur.id + 1] || null;
}

// ---------- 연속 출석 ----------
function updateStreak() {
  const today = todayStr();
  if (SAVE.lastPlayDate === today) return; // 오늘 이미 체크됨
  const diff = daysBetween(SAVE.lastPlayDate, today);
  if (diff === 1) SAVE.streak = (SAVE.streak || 0) + 1;
  else if (diff === null || diff > 1) SAVE.streak = 1;
  SAVE.lastPlayDate = today;
  saveSave(SAVE);
  checkBadges();
}

// ---------- 뱃지 ----------
const newBadgeQueue = [];
function awardBadge(id) {
  if (SAVE.badges.includes(id)) return false;
  SAVE.badges.push(id);
  saveSave(SAVE);
  newBadgeQueue.push(id);
  playBadge();
  showBadgeToast(id);
  return true;
}
function showBadgeToast(id) {
  const badge = BADGES.find(b => b.id === id);
  if (!badge) return;
  const existing = document.querySelector('.badge-toast');
  if (existing) existing.remove();
  const toast = el('div', { class: 'badge-toast' },
    el('span', { class: 'bt-icon' }, badge.icon),
    el('div', { class: 'bt-text' },
      el('span', { class: 'bt-label' }, '뱃지 획득'),
      el('span', {}, badge.name)
    )
  );
  document.body.appendChild(toast);
  requestAnimationFrame(() => toast.classList.add('show'));
  setTimeout(() => { toast.classList.remove('show'); setTimeout(() => toast.remove(), 400); }, 2500);
}

function checkBadges() {
  const stats = SAVE.stats;
  const triggers = [
    ['first_correct', stats.correctCount >= 1],
    ['combo_5',       stats.maxCombo >= 5],
    ['combo_10',      stats.maxCombo >= 10],
    ['combo_20',      stats.maxCombo >= 20],
    ['perfect_1',     stats.perfectStages >= 1],
    ['perfect_5',     stats.perfectStages >= 5],
    ['stars_20',      stats.totalStars >= 20],
    ['stars_50',      stats.totalStars >= 50],
    ['stars_100',     stats.totalStars >= 100],
    ['streak_3',      SAVE.streak >= 3],
    ['streak_7',      SAVE.streak >= 7],
    ['streak_30',     SAVE.streak >= 30],
    ['correct_100',   stats.correctCount >= 100],
    ['correct_500',   stats.correctCount >= 500],
    ['chest_open',    stats.chestsOpened >= 1],
    ['all_grades',    (stats.gradesPlayed || []).length >= 6],
    ['rank_3',        getCurrentRank().id >= 3],
    ['rank_5',        getCurrentRank().id >= 5],
    ['boss_1',        stats.bossDefeats >= 1],
    ['boss_5',        stats.bossDefeats >= 5],
    ['boss_perfect',  stats.bossPerfects >= 1],
    ['speed_5',       stats.fastAnswers >= 5],
    ['speed_20',      stats.fastAnswers >= 20],
    ['daily_1',       stats.dailyCompletions >= 1],
    ['daily_7',       stats.dailyCompletions >= 7],
  ];
  // stage milestones
  const maxStage = Math.max(1, ...Object.values(SAVE.units).map(u => u.stage || 1));
  triggers.push(['stage_5', maxStage >= 5]);
  triggers.push(['stage_10', maxStage >= 10]);

  for (const [id, cond] of triggers) if (cond) awardBadge(id);
}

function recomputeTotalStars() {
  SAVE.stats.totalStars = Object.values(SAVE.units).reduce((s, u) => s + (u.stars || 0), 0);
}

const app = document.getElementById('app');
let currentAnswer = ''; // for keypad input

function el(tag, attrs = {}, ...children) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') e.className = v;
    else if (k === 'html') e.innerHTML = v;
    else if (k === 'style') e.style.cssText = v;
    else if (k.startsWith('on') && typeof v === 'function') e.addEventListener(k.slice(2), v);
    else if (v !== null && v !== undefined) e.setAttribute(k, v);
  }
  for (const c of children) {
    if (c == null) continue;
    if (typeof c === 'string' || typeof c === 'number') e.appendChild(document.createTextNode(c));
    else e.appendChild(c);
  }
  return e;
}

// 수학 텍스트를 예쁘게: 분수 스택, 연산자 색상화
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
}
function formatMath(text) {
  let html = escapeHtml(text);
  // 분수 a/b → 분자/분모 스택
  html = html.replace(/(?<![\d.])(-?\d+)\/(\d+)(?![\d.])/g,
    '<span class="frac"><span class="frac-num">$1</span><span class="frac-den">$2</span></span>');
  // 연산자 ± × ÷
  html = html.replace(/ ([+\-×÷]) /g, ' <span class="op">$1</span> ');
  // = ? 패턴
  html = html.replace(/=\s*\?/g, '<span class="op-eq">=</span> <span class="qmark">?</span>');
  return html;
}

function render(node) {
  app.innerHTML = '';
  app.appendChild(node);
}

    hr < 5  ? '오늘도 화이팅!' :
    hr < 12 ? '좋은 아침이에요' :

      class: 'mute-btn' + (SAVE.relaxedMode ? ' active' : ''),

    }),

  const next = getNextRank();
  const rankPct = next ? Math.min(100, ((SAVE.coins - rank.min) / (next.min - rank.min)) * 100) : 100;
  const rankPanel = el('div', { class: 'rank-panel', style: `--rank-color: ${rank.color};` },
    el('div', { class: 'rank-bubble' }),
    el('div', { class: 'rank-row' },
      el('div', { class: 'rank-icon-big' }, rank.icon),
      el('div', { class: 'rank-text' },
        el('div', { class: 'rank-label' }, '내 랭크'),
        el('div', { class: 'rank-name' }, rank.name),
        SAVE.streak > 0 ? el('div', { class: 'rank-streak', html: icon('flame', { size: 12 }) + ' ' + SAVE.streak + '일 연속' }) : null,
      ),
    ),

      el('div', { class: 'rank-bar-fill', style: `width: ${rankPct}%;` })
    ),
    el('div', { class: 'rank-progress-text' },
      el('span', {}, next ? `${SAVE.coins} / ${next.min} P` : '최고 랭크!'),
      el('span', {}, next ? `${next.name}까지 ${next.min - SAVE.coins} P` : '👑'),
    ),
  );

  const actions = el('div', { class: 'home-actions' },

      el('span', { class: 'ap-val' }, `${unlockedBadges} / ${BADGES.length}`)
    ),
    el('div', { class: 'action-pill', onclick: () => render(screenStats()) },
      el('span', { class: 'ap-label', html: icon('chart', { size: 16 }) + ' 기록' }),
      el('span', { class: 'ap-val' }, `정답 ${SAVE.stats.correctCount}`)
    ),
  );

  // 데일리 챌린지 카드
  const today = todayStr();
  const dailyDone = SAVE.dailyChallenge.date === today && SAVE.dailyChallenge.completed;
  const dailyCard = el('div', {
    class: 'daily-card' + (dailyDone ? ' done' : ''),
    onclick: () => { if (!dailyDone) startDailyChallenge(); }
  },
    el('div', { class: 'daily-icon', html: icon(dailyDone ? 'check' : 'target', { size: 26 }) }),
    el('div', { class: 'daily-text' },
      el('div', { class: 'daily-label' }, dailyDone ? '오늘 완료!' : '오늘의 도전'),
      el('div', { class: 'daily-desc' }, dailyDone ? '내일 다시 만나요' : '7문제 · 시간제한 25초 · 코인 2배')

  const weak = getWeakUnit();
  const reviewCount = (SAVE.reviewQueue || []).length;
  let recommendCard = null;
  if (weak) {
    const accPct = Math.round(weak.acc * 100);
    recommendCard = el('div', {
      class: 'recommend-card weak',
      onclick: () => startStage(weak.grade, weak.unit.id),
    },
      el('div', { class: 'rec-icon', html: icon('target', { size: 22 }) }),
      el('div', { class: 'rec-text' },

        el('div', { class: 'rec-desc' }, `${weak.unit.name} · 정답률 ${accPct}%${reviewCount ? ` · 복습 ${reviewCount}` : ''}`),

      el('div', { class: 'rec-arrow' }, '▶')

    // 약점 단원은 없지만 복습 큐가 있으면, 복습 큐 안내

    const reviewUnitId = firstReview.unitId;
    let reviewUnit = null, reviewGrade = null;
    for (const [g, info] of Object.entries(GRADES)) {
      const u = info.units.find(x => x.id === reviewUnitId);
      if (u) { reviewUnit = u; reviewGrade = +g; break; }
    }
    if (reviewUnit) {
      recommendCard = el('div', {
        class: 'recommend-card review',

        el('div', { class: 'rec-icon', html: icon('repeat', { size: 22 }) }),

  const home = el('div', { class: 'home' },
    rankPanel,
    actions,
    dailyCard,
    recommendCard,
    el('div', { class: 'home-title' }, '학년 선택'),
    el('div', { class: 'home-sub' }, '문제는 매번 새로 생성됩니다. 스테이지가 올라갈수록 난이도가 상승합니다.')
  );

  const grid = el('div', { class: 'grade-grid' });
  for (const g of Object.keys(GRADES)) {
    const info = GRADES[g];
    const totalStars = info.units.reduce((s, u) => s + getUnitProgress(u.id).stars, 0);
    const maxStars = info.units.length * 3;
    const completedUnits = info.units.filter(u => getUnitProgress(u.id).stars >= 1).length;
    const isFullyMastered = totalStars === maxStars && maxStars > 0;
    const card = el('div', {

      style: `--grade-accent: ${info.color};`,
      onclick: () => render(screenUnits(+g))
    },
      isFullyMastered ? el('div', { class: 'crown', html: icon('crown', { size: 18 }) }) : null,
      el('div', { class: 'stars' }, `★ ${totalStars} / ${maxStars}`),
      el('div', { class: 'emoji' }, info.emoji),
      el('div', { class: 'g-text' },
        el('div', { class: 'g-name' }, info.name),
        el('div', { class: 'g-desc' }, info.desc),
      ),
      el('div', { class: 'g-units' }, `${completedUnits} / ${info.units.length} 단원`)
    );
    grid.appendChild(card);
  }
  home.appendChild(grid);
  screen.append(topbar, home);
  return screen;
}

  const overallAcc = totalAttempts > 0 ? Math.round(totalCorrect / totalAttempts * 100) : null;
  const maxStage = Math.max(1, ...Object.values(SAVE.units).map(u => u.stage || 1));

  const stats = [
