    { label: '퍼펙트 스테이지', value: SAVE.stats.perfectStages, icon: '💯' },
    { label: '최고 스테이지', value: maxStage, icon: '🎮' },
    { label: '연속 출석', value: `${SAVE.streak}일`, icon: '🔥' },
    { label: '복습 대기', value: `${(SAVE.reviewQueue || []).length}개`, icon: '🔁' },
  ];
  const body = el('div', { class: 'units' });
  for (const s of stats) {
    body.appendChild(el('div', { class: 'unit-card', style: `--unit-accent: #1a1a1f; --unit-icon-bg: #f4f4f7;` },
      el('div', { class: 'unit-icon' }, s.icon),
      el('div', { class: 'unit-body' },
        el('div', { class: 'unit-name' }, s.label),
        el('div', { class: 'unit-meta' },
          el('span', { style: 'color:#1a1a1f; font-weight:800; font-size:14px; letter-spacing:-0.3px;' }, String(s.value)),
          el('span', {}, '')
        )
      )
    ));
  }

  // 단원별 정답률 섹션 (5회 이상 시도한 단원만)
  const unitAccs = [];
  for (const [grade, info] of Object.entries(GRADES)) {
    for (const unit of info.units) {
      const p = getUnitProgress(unit.id);
      if (!p.attempts || p.attempts < 5) continue;
      unitAccs.push({ grade: +grade, unit, p, acc: p.correct / p.attempts });
    }
  }
  unitAccs.sort((a, b) => a.acc - b.acc); // 약점부터

  if (unitAccs.length > 0) {
    body.appendChild(el('div', { class: 'home-title', style: 'margin-top:24px; padding:0 4px;' }, '단원별 정답률'));
    body.appendChild(el('div', { class: 'home-sub', style: 'padding:0 4px; margin-bottom:10px;' }, '낮은 순으로 정렬 — 약점 단원이 위로 올라옵니다'));
    for (const item of unitAccs) {
      const accPct = Math.round(item.acc * 100);
      const accColor = accPct < 60 ? 'var(--danger)' : accPct < 80 ? 'var(--accent)' : 'var(--success)';
      body.appendChild(el('div', {
        class: 'unit-card',
        style: `--unit-accent: ${accColor}; --unit-icon-bg: #f4f4f7; cursor: pointer;`,
        onclick: () => startStage(item.grade, item.unit.id),
      },
        el('div', { class: 'unit-icon', html: icon(UNIT_ICONS[item.unit.id] || 'hash', { size: 22 }) }),
        el('div', { class: 'unit-body' },
          el('div', { class: 'unit-name' }, `${item.grade}학년 · ${item.unit.name}`),
          el('div', { class: 'unit-meta' },
            el('span', { style: `color:${accColor}; font-weight:800; font-size:14px;` }, `${accPct}%`),
            el('span', {}, `${item.p.correct} / ${item.p.attempts}`),
          )
        )
      ));
    }
  }

  screen.append(topbar, body);
  return screen;
}

// ---------- Unit list ----------
function screenUnits(grade) {
  const info = GRADES[grade];
  const screen = el('div', { class: 'screen' });
  const topbar = el('div', { class: 'topbar' },
    el('button', { class: 'back', onclick: () => render(screenHome()), html: icon('chevron-left', { size: 18 }) }),
    el('div', {},
      el('div', { class: 'title' }, info.name),
      el('div', { class: 'sub' }, '단원을 고르세요')
    ),
    el('div', { class: 'coins', html: String(SAVE.coins) + '<span class="coin-suffix">P</span>' })
  );

  const units = el('div', { class: 'units' });
  info.units.forEach((u, idx) => {
    const p = getUnitProgress(u.id);
    const maxStageShown = 10;
    const pct = Math.min(100, ((p.stage - 1) / maxStageShown) * 100);
    const starStr = '★'.repeat(p.stars) + '☆'.repeat(3 - p.stars);
    // 다음 스테이지가 보스(5의 배수)인지, 타이머가 있는지 확인
    const nextIsBoss = p.stage % 5 === 0;
    const nextHasTimer = p.stage >= 7;
    const tags = [];
    if (nextIsBoss) tags.push(el('span', { class: 'unit-tag boss' }, '⚔️ 보스'));
    else if (nextHasTimer) tags.push(el('span', { class: 'unit-tag timer' }, '⏰ 타이머'));
    if (p.stars === 3 && p.stage > 1) tags.push(el('span', { class: 'unit-tag perfect' }, '💯 PERFECT'));

    const card = el('div', {
      class: 'unit-card',
      style: `--unit-accent: ${info.color}; --unit-icon-bg: ${info.color}1a;`,
      onclick: () => startStage(grade, u.id)
    },
      el('div', { class: 'unit-icon', html: icon(UNIT_ICONS[u.id] || 'hash', { size: 22 }) }),
      el('div', { class: 'unit-body' },
        el('div', { class: 'unit-name-row' },
          el('div', { class: 'unit-name' }, u.name),
          tags.length ? el('div', { class: 'unit-tags' }, ...tags) : null
        ),
        el('div', { class: 'unit-progress-bar' },
          el('div', { class: 'unit-progress-fill', style: `width: ${pct}%;` })
        ),
        el('div', { class: 'unit-meta' },
          el('span', { class: 'unit-stage-label' },
            el('span', { class: 'meta-label' }, '다음'),
            el('span', { class: 'meta-value' }, `STAGE ${p.stage}`)
          ),
          el('span', { class: 'unit-stars' }, starStr)
        )
      )
    );
    units.appendChild(card);
  });

  screen.append(topbar, units);
  return screen;
}

// ---------- Play (quiz) ----------
// 데일리 챌린지 시작 — 무작위 학년/단원에서 7문제 출제
function startDailyChallenge() {
  const today = todayStr();
  if (SAVE.dailyChallenge.date === today && SAVE.dailyChallenge.completed) {
    alert('오늘의 도전은 이미 완료했어요! 내일 다시 만나요 🎯');
    return;
  }
  // 매일 시드 고정: 같은 날에는 같은 단원이 출제됨
  const seed = parseInt(today.replace(/-/g,''), 10);
  const allGrades = Object.keys(GRADES).map(Number);
  const grade = allGrades[seed % allGrades.length];
  const units = GRADES[grade].units;
  const unit = units[(seed * 7) % units.length];
  // 도전적 stage (3~6)
  const stage = 3 + (seed % 4);
  // 데일리는 unit.stage 진행도와 무관하게 진행
  startStage(grade, unit.id, { isDaily: true, stage });
}

function startStage(grade, unitId, opts = {}) {
  const info = GRADES[grade];
  const unit = info.units.find(u => u.id === unitId);
  const prog = getUnitProgress(unitId);
  const stage = opts.stage || prog.stage;

  // 보스 스테이지: stage가 5의 배수
  const isBoss = !opts.isDaily && stage % 5 === 0;
  const numProblems = isBoss ? 7 : 5;
  // 보스 스테이지는 더 어려운 단계의 문제 사용
  let generateStage = isBoss ? Math.max(stage, stage + 2) : stage;
  // 적응형 완화: 같은 단원에서 3회 이상 연속 실패 시 한 번 stage 낮춤
  const unitProg = getUnitProgress(unit.id);
  const adaptiveEase = !opts.isDaily && (unitProg.consecutiveFails || 0) >= 3;
  if (adaptiveEase) generateStage = Math.max(1, generateStage - 1);

  // 시간제한: 일반 stage 7+ → 30초, 13+ → 20초, 보스 → 25초
  let timeLimit = null;
  if (isBoss) timeLimit = 25;
  else if (stage >= 13) timeLimit = 20;
  else if (stage >= 7) timeLimit = 30;

  // 데일리 챌린지: 7문제, 시간제한 25초, 어려운 stage로 출제
  if (opts.isDaily) {
    timeLimit = 25;
  }

  // 천천히 모드: 보스/데일리를 제외한 일반 스테이지의 시간 제한 비활성화
  if (SAVE.relaxedMode && !isBoss && !opts.isDaily) {
    timeLimit = null;
  }

  const problems = [];
  const seen = new Set();
  let guard = 0;
  const targetCount = opts.isDaily ? 7 : numProblems;
  // 1) 복습 큐에서 우선 — 일반 단원은 최대 2개, 보스는 1개, 데일리는 미사용
  const reviewSlots = opts.isDaily ? 0 : (isBoss ? 1 : 2);
  if (reviewSlots > 0) {
    const reviews = takeReviewProblems(unit.id, reviewSlots);
    for (const r of reviews) {
      const key = r.q + '|' + String(r.a) + '|' + (r.visual ? JSON.stringify(r.visual) : '');
      seen.add(key);
      problems.push(r);
    }
  }
  // 2) 나머지는 generate로 채움
  while (problems.length < targetCount && guard++ < 300) {
    const p = unit.generate(generateStage);
    if (!p || p.a === undefined || p.a === null) continue;
    const key = p.q + '|' + String(p.a) + '|' + (p.visual ? JSON.stringify(p.visual) : '');
    if (seen.has(key) && guard < 80) continue;
    seen.add(key);
    problems.push(p);
  }
  // 3) 셔플 — 복습 문제가 항상 처음에 오는 패턴 회피
  for (let i = problems.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [problems[i], problems[j]] = [problems[j], problems[i]];
  }

  const state = {
    grade, unit, stage,
    problems,
    idx: 0,
    hearts: 3,
    combo: 0,
    coinsEarned: 0,
    results: [],
    isBoss,
    isDaily: !!opts.isDaily,
    timeLimit,
    questionStartTime: 0,
  };
  render(screenPlay(state));
}

function screenPlay(state) {
  currentAnswer = '';
  state.locked = false;
  // 타이머 정리
  if (window.__playTimerId) { clearTimeout(window.__playTimerId); window.__playTimerId = null; }

  const screen = el('div', { class: 'screen' });
  const info = GRADES[state.grade];

  // 보스/데일리 라벨
  let stageLabel = `스테이지 ${state.stage}`;
  if (state.isBoss) stageLabel = `⚔️ 보스 스테이지 ${state.stage}`;
  if (state.isDaily) stageLabel = `🎯 오늘의 도전`;

  const topbar = el('div', { class: 'topbar' },
    el('button', {
      class: 'back',
      html: icon('chevron-left', { size: 18 }),
      onclick: () => {
        if (confirm('스테이지를 그만두고 단원으로 돌아갈까요?')) {
          if (window.__playTimerId) { clearTimeout(window.__playTimerId); window.__playTimerId = null; }
          render(state.isDaily ? screenHome() : screenUnits(state.grade));
        }
      }
    }),
    el('div', {},
      el('div', { class: 'title' }, `${state.unit.name}`),
      el('div', { class: 'sub' }, stageLabel)
    ),
    el('div', { class: 'coins', html: String(SAVE.coins + state.coinsEarned) + '<span class="coin-suffix">P</span>' })
  );

  const play = el('div', { class: 'play' });

  // 보스 배너
  if (state.isBoss) {
    play.appendChild(el('div', { class: 'boss-banner', html: icon('sword', { size: 14 }) + ' 보스 스테이지 ' + icon('sword', { size: 14 }) }));
  } else if (state.isDaily) {
    play.appendChild(el('div', { class: 'boss-banner daily', html: icon('target', { size: 14 }) + ' 오늘의 도전' }));
  }

  const hud = el('div', { class: 'hud' });
  const hearts = el('div', { class: 'hearts' });
  for (let i = 0; i < 3; i++) {
    hearts.appendChild(el('span', { class: i < state.hearts ? 'heart' : 'heart lost', html: icon(i < state.hearts ? 'heart' : 'heart-empty', { size: 22 }) }));
  }
  const combo = el('div', {
    class: 'combo-badge' + (state.combo >= 2 ? ' show' : ''), id: 'combo',
    html: icon('flame', { size: 14 }) + ' ' + state.combo + ' 콤보'
  });
  hud.append(hearts, combo);
  play.appendChild(hud);

  const dots = el('div', { class: 'progress-dots' });
  for (let i = 0; i < state.problems.length; i++) {
    let cls = 'dot';
    if (state.results[i] === true) cls += ' done';
    else if (state.results[i] === false) cls += ' wrong';
    dots.appendChild(el('div', { class: cls }));
  }
  play.appendChild(dots);

  // 타이머 바
  if (state.timeLimit) {
    const timerBar = el('div', { class: 'timer-bar' },
      el('div', {
        class: 'timer-fill',
        id: 'timerFill',
        style: `animation: countdown ${state.timeLimit}s linear forwards;`
      })
    );
    play.appendChild(timerBar);
  }

  const current = state.problems[state.idx];
  // 문제 시작 시각 기록 (스피드 보너스용)
  state.questionStartTime = Date.now();

  // 시간초과 자동 오답 처리
  if (state.timeLimit) {
    window.__playTimerId = setTimeout(() => {
      if (state.results[state.idx] === undefined) {
        currentAnswer = ''; // 빈 답으로 제출
        submitAnswer(state, true); // timeout=true
      }
    }, state.timeLimit * 1000);
  }

  const kind = answerKind(current);
  const ansBox = el('div', { class: 'answer-box ' + kind, id: 'ansBox', html: renderAnswerBox('', kind) });

  const problemArea = el('div', { class: 'problem-area' + (state.hearts === 1 ? ' danger' : '') + (state.isBoss ? ' boss' : ''), id: 'problemArea' },
    el('div', { class: 'q-stage' }, `문제 ${state.idx + 1} / ${state.problems.length}`),
    current.visual ? el('div', { class: 'problem-visual', html: renderVisual(current.visual) }) : null,
    el('div', { class: 'q-text' + (current.q.length > 22 ? ' small' : ''), html: formatMath(current.q) }),
    ansBox,
    el('div', { class: 'feedback', id: 'feedback' })
  );
  play.appendChild(problemArea);

  if (kind === 'mcq') {
    const grid = el('div', { class: 'mcq-grid' });
    current.choices.forEach((choice, i) => {
      const btn = el('button', {
        class: 'mcq-option',
        'data-mcq-idx': String(i),
        onclick: () => pickMcq(String(choice), state),
      }, String(choice));
      grid.appendChild(btn);
    });
    play.appendChild(grid);
  } else {
    const keypad = el('div', { class: 'keypad ' + kind });
    const numRow = (a, b, c) => [a, b, c];
    const layout = [
      numRow('1', '2', '3'),
      numRow('4', '5', '6'),
      numRow('7', '8', '9'),
    ];
    if (kind === 'integer') {
      layout.push([
        { k: 'DEL', label: '지우기', cls: 'secondary' },
        '0',
        { k: 'OK',  label: '확인', cls: 'action' },
      ]);
    } else if (kind === 'decimal') {
      layout.push([
        { k: 'DEL', label: '지우기', cls: 'secondary' },
        '0',
        '.',
      ]);
      layout.push([{ k: 'OK', label: '확인', cls: 'action span3' }]);
    } else { // fraction
      layout.push([
        { k: 'DEL', label: '지우기', cls: 'secondary' },
        '0',
        { k: '/',   label: '⁄', cls: 'frac-key' },
      ]);
      layout.push([{ k: 'OK', label: '확인', cls: 'action span3' }]);
    }
    layout.forEach(row => row.forEach(item => {
      const it = typeof item === 'string' ? { k: item, label: item } : item;
      const cls = 'key' + (it.cls ? ' ' + it.cls : '');
      const onclick = it.k === 'OK' ? () => submitAnswer(state) : () => pressKey(it.k, state);
      keypad.appendChild(el('button', { class: cls, onclick }, it.label));
    }));
    play.appendChild(keypad);
  }

  screen.append(topbar, play);
  return screen;
}

function pressKey(k, state) {
  const box = document.getElementById('ansBox');
  if (!box) return;
  const kind = state && state.problems[state.idx] ? answerKind(state.problems[state.idx]) : 'integer';
  if (k === 'DEL') {
    currentAnswer = currentAnswer.slice(0, -1);
  } else {
    if (currentAnswer.length >= 10) return;
    if (k === '.' && currentAnswer.includes('.')) return;
    if (k === '/' && currentAnswer.includes('/')) return;
    if (k === '/' && currentAnswer === '') return; // 분모만 입력 방지
    currentAnswer += k;
  }
  box.innerHTML = renderAnswerBox(currentAnswer, kind);
  box.classList.remove('correct', 'wrong');
}

// 객관식 보기 선택 — 즉시 제출
function pickMcq(value, state) {
  // 이미 채점 중이면 무시
  if (state.locked) return;
  state.locked = true;
  currentAnswer = value;
  // 선택한 보기 시각 표시
  document.querySelectorAll('.mcq-option').forEach(b => {
    if (b.textContent === value) b.classList.add('chosen');
    b.disabled = true;
  });
  const box = document.getElementById('ansBox');
  if (box) box.textContent = value;
  submitAnswer(state);
}

// 답 박스 렌더링 — 분수일 때 분자/분모 분리 표시
function renderAnswerBox(s, kind) {
  if (s === '') {
    if (kind === 'fraction') {
      return `<span class="frac"><span class="num">?</span><span class="den">?</span></span>`;
    }
    return '?';
  }
  if (kind === 'fraction') {
    const slash = s.indexOf('/');
    if (slash === -1) {
      return `<span class="frac"><span class="num">${s}</span><span class="den">?</span></span>`;
    }
    const num = s.slice(0, slash) || '?';
    const den = s.slice(slash + 1) || '?';
    return `<span class="frac"><span class="num">${num}</span><span class="den">${den}</span></span>`;
  }
  return s;
}

function icon(name, opts = {}) {
  const inner = ICONS[name];
  if (!inner) return '';
  const size = opts.size || 22;
  const sw = opts.strokeWidth || 2;
  return `<svg class="ico" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round">${inner}</svg>`;
}

// =============================================================
// 시각 자료 (도형/분수/시계 등) — 인라인 SVG 자동 생성
// =============================================================
const VISUAL = {
  // 정사각형
  square: () => `
    <svg viewBox="0 0 140 120" xmlns="http://www.w3.org/2000/svg">
      <rect x="30" y="20" width="80" height="80" fill="#eef0ff" stroke="#6366f1" stroke-width="3" rx="4"/>
    </svg>`,
  // 직사각형 (비율만 유지, 라벨 없음)
  rectangle: ({ w, h }) => {
    const max = Math.max(w || 5, h || 3);
    const rw = ((w || 5) / max) * 90;
    const rh = ((h || 3) / max) * 60;
    const x = (140 - rw) / 2;
    const y = (110 - rh) / 2;
    return `
    <svg viewBox="0 0 140 110" xmlns="http://www.w3.org/2000/svg">
      <rect x="${x}" y="${y}" width="${rw}" height="${rh}" fill="#eef0ff" stroke="#6366f1" stroke-width="3" rx="4"/>
    </svg>`;
  },
  // 정삼각형
  triangle: () => `
    <svg viewBox="0 0 140 120" xmlns="http://www.w3.org/2000/svg">
      <polygon points="70,20 25,95 115,95" fill="#eef0ff" stroke="#6366f1" stroke-width="3" stroke-linejoin="round"/>
    </svg>`,
  // 일반 삼각형 (밑변 + 높이 점선)
  triangleBH: () => `
    <svg viewBox="0 0 160 120" xmlns="http://www.w3.org/2000/svg">
      <polygon points="80,15 25,105 135,105" fill="#eef0ff" stroke="#6366f1" stroke-width="3" stroke-linejoin="round"/>
      <line x1="80" y1="15" x2="80" y2="105" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4,3"/>
    </svg>`,
  // 사다리꼴 (높이 점선)
  trapezoid: () => `
    <svg viewBox="0 0 160 120" xmlns="http://www.w3.org/2000/svg">
      <polygon points="50,20 110,20 135,100 25,100" fill="#eef0ff" stroke="#6366f1" stroke-width="3" stroke-linejoin="round"/>
      <line x1="80" y1="20" x2="80" y2="100" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4,3"/>
    </svg>`,
  // 원 (반지름 또는 지름 라벨, hideLabel: 라벨/지표선 모두 숨김)
  circle: ({ r, d, unit = 'cm', hideLabel }) => {
    const radius = 50;
    const labelText = d != null ? `지름 ${d}${unit}` : `반지름 ${r}${unit}`;
    const indicator = hideLabel ? '' : (d != null
      ? `<line x1="20" y1="60" x2="120" y2="60" stroke="#f59e0b" stroke-width="2"/>`
      : `<line x1="70" y1="60" x2="120" y2="60" stroke="#f59e0b" stroke-width="2"/>`);
    const center = hideLabel ? '' : `<circle cx="70" cy="60" r="2.5" fill="#6366f1"/>`;
    const label = hideLabel ? '' : `<text x="70" y="120" text-anchor="middle" font-size="13" fill="#1a1d2e" font-weight="700" font-family="system-ui">${labelText}</text>`;
    return `
    <svg viewBox="0 0 140 130" xmlns="http://www.w3.org/2000/svg">
      <circle cx="70" cy="60" r="${radius}" fill="#eef0ff" stroke="#6366f1" stroke-width="3"/>
      ${center}
      ${indicator}
      ${label}
    </svg>`;
  },
  // 정n각형 (highlight: 'sides' | 'vertices' | 'diagonals' | 'angles' | 'symmetry')
  polygon: ({ n, highlight }) => {
    const cx = 70, cy = 60, R = 45;
    // n=4는 변이 수평/수직인 정사각형 형태로, 그 외는 위 꼭짓점 시작
    const startAngle = n === 4 ? -Math.PI / 4 * 3 : -Math.PI / 2;
    const pts = [];
    for (let i = 0; i < n; i++) {
      const a = startAngle + (i * 2 * Math.PI / n);
      pts.push({ x: cx + R * Math.cos(a), y: cy + R * Math.sin(a), a });
    }
    const ptStr = pts.map(p => `${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ');

    let extra = '';
    if (highlight === 'sides') {
      // 각 변을 굵은 주황 선으로
      extra = pts.map((p, i) => {
        const q = pts[(i + 1) % n];
        return `<line x1="${p.x.toFixed(1)}" y1="${p.y.toFixed(1)}" x2="${q.x.toFixed(1)}" y2="${q.y.toFixed(1)}" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>`;
      }).join('');
    } else if (highlight === 'diagonals') {
      // 모든 대각선 (인접 꼭짓점 제외)
      const lines = [];
      for (let i = 0; i < n; i++) {
        for (let j = i + 2; j < n; j++) {
          if (i === 0 && j === n - 1) continue; // 인접
          lines.push(`<line x1="${pts[i].x.toFixed(1)}" y1="${pts[i].y.toFixed(1)}" x2="${pts[j].x.toFixed(1)}" y2="${pts[j].y.toFixed(1)}" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4,3"/>`);
        }
      }
      extra = lines.join('');
    } else if (highlight === 'angles') {
      // 각 꼭짓점에 작은 호
      extra = pts.map((p, i) => {
        const prev = pts[(i - 1 + n) % n];
        const next = pts[(i + 1) % n];
        const v1 = { x: prev.x - p.x, y: prev.y - p.y };
        const v2 = { x: next.x - p.x, y: next.y - p.y };
        const len1 = Math.hypot(v1.x, v1.y), len2 = Math.hypot(v2.x, v2.y);
        const arcR = 10;
        const ax1 = p.x + v1.x / len1 * arcR, ay1 = p.y + v1.y / len1 * arcR;
        const ax2 = p.x + v2.x / len2 * arcR, ay2 = p.y + v2.y / len2 * arcR;
        return `<path d="M ${ax1.toFixed(1)} ${ay1.toFixed(1)} A ${arcR} ${arcR} 0 0 0 ${ax2.toFixed(1)} ${ay2.toFixed(1)}" fill="none" stroke="#f59e0b" stroke-width="2"/>`;
      }).join('');
    } else if (highlight === 'symmetry') {
      // 대칭축: 정n각형의 모든 대칭축은 n개 (중심 통과)
      const lines = [];
      // 짝수: 꼭짓점-꼭짓점, 변중점-변중점 / 홀수: 꼭짓점-반대 변 중점
      for (let i = 0; i < n; i++) {
        const a = -Math.PI / 2 + (i * Math.PI / n);
        const x1 = cx + (R + 8) * Math.cos(a), y1 = cy + (R + 8) * Math.sin(a);
        const x2 = cx - (R + 8) * Math.cos(a), y2 = cy - (R + 8) * Math.sin(a);
        lines.push(`<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="#ef4444" stroke-width="1.6" stroke-dasharray="3,2"/>`);
      }
      extra = lines.join('');
    } else {
      // 기본: 꼭짓점 점만 표시
      extra = pts.map(p => `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="3" fill="#f59e0b"/>`).join('');
    }
    // vertices 옵션은 큰 점으로
    if (highlight === 'vertices') {
      extra = pts.map(p => `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="5.5" fill="#f59e0b" stroke="#d97706" stroke-width="2"/>`).join('');
    }

    return `
    <svg viewBox="0 0 140 130" xmlns="http://www.w3.org/2000/svg">
      <polygon points="${ptStr}" fill="#eef0ff" stroke="#6366f1" stroke-width="3" stroke-linejoin="round"/>
      ${extra}
    </svg>`;
  },
  // 분수 파이 (numerator / denominator 색칠)
  fraction: ({ n, d }) => {
    const cx = 60, cy = 60, R = 45;
    const slices = [];
    for (let i = 0; i < d; i++) {
      const a1 = -Math.PI / 2 + (i * 2 * Math.PI / d);
      const a2 = -Math.PI / 2 + ((i + 1) * 2 * Math.PI / d);
      const x1 = cx + R * Math.cos(a1), y1 = cy + R * Math.sin(a1);
      const x2 = cx + R * Math.cos(a2), y2 = cy + R * Math.sin(a2);
      const large = (a2 - a1) > Math.PI ? 1 : 0;
      const fill = i < n ? '#6366f1' : '#eef0ff';
      slices.push(`<path d="M ${cx} ${cy} L ${x1.toFixed(1)} ${y1.toFixed(1)} A ${R} ${R} 0 ${large} 1 ${x2.toFixed(1)} ${y2.toFixed(1)} Z" fill="${fill}" stroke="white" stroke-width="2"/>`);
    }
    return `
    <svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
      ${slices.join('')}
      <circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="#6366f1" stroke-width="2.5"/>
    </svg>`;
  },
  // 분수 막대 (가로 직사각형을 d 등분)
  fractionBar: ({ n, d }) => {
    const total = 120, h = 30;
    const each = total / d;
    const cells = [];
    for (let i = 0; i < d; i++) {
      const x = 10 + i * each;
      const fill = i < n ? '#6366f1' : '#eef0ff';
      cells.push(`<rect x="${x}" y="20" width="${each}" height="${h}" fill="${fill}" stroke="#6366f1" stroke-width="2"/>`);
    }
    return `
    <svg viewBox="0 0 140 70" xmlns="http://www.w3.org/2000/svg">
      ${cells.join('')}
    </svg>`;
  },
  // 시계 (시간/분 표시)
  clock: ({ h, m }) => {
    const cx = 70, cy = 70, R = 50;
    // hour hand: 12시 = 위, 시계방향. 1시간 = 30°, 1분당 추가 0.5°
    const hourAngle = ((h % 12) * 30 + m * 0.5 - 90) * Math.PI / 180;
    const minAngle = (m * 6 - 90) * Math.PI / 180;
    const hx = cx + 28 * Math.cos(hourAngle), hy = cy + 28 * Math.sin(hourAngle);
    const mx = cx + 42 * Math.cos(minAngle), my = cy + 42 * Math.sin(minAngle);
    // 시각 마커
    const ticks = [];
    for (let i = 0; i < 12; i++) {
      const a = (i * 30 - 90) * Math.PI / 180;
      const x1 = cx + (R - 4) * Math.cos(a), y1 = cy + (R - 4) * Math.sin(a);
      const x2 = cx + R * Math.cos(a), y2 = cy + R * Math.sin(a);
      ticks.push(`<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="#6366f1" stroke-width="2"/>`);
    }
    // 12, 3, 6, 9 숫자
    const nums = [];
    [[12, 0, -30], [3, 30, 0], [6, 0, 30], [9, -30, 0]].forEach(([n, dx, dy]) => {
      nums.push(`<text x="${cx + dx * 1.2}" y="${cy + dy * 1.2 + 5}" text-anchor="middle" font-size="11" fill="#6366f1" font-weight="800" font-family="system-ui">${n}</text>`);
    });
    return `
    <svg viewBox="0 0 140 140" xmlns="http://www.w3.org/2000/svg">
      <circle cx="${cx}" cy="${cy}" r="${R}" fill="#eef0ff" stroke="#6366f1" stroke-width="3"/>
      ${ticks.join('')}
      ${nums.join('')}
      <line x1="${cx}" y1="${cy}" x2="${hx.toFixed(1)}" y2="${hy.toFixed(1)}" stroke="#1a1d2e" stroke-width="4" stroke-linecap="round"/>
      <line x1="${cx}" y1="${cy}" x2="${mx.toFixed(1)}" y2="${my.toFixed(1)}" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
      <circle cx="${cx}" cy="${cy}" r="3" fill="#1a1d2e"/>
    </svg>`;
  },
  // 직육면체 (3D 비스듬, highlight: 'face' | 'vertices' | 'edges' | 'parallelFace')
  cuboid: ({ w, h, d, unit = '', highlight, showLabels = false }) => {
    // 8 vertices: 앞면 4(왼위, 오위, 오아래, 왼아래) + 뒷면 4
    const fA = { x: 20, y: 40 }, fB = { x: 110, y: 40 }, fC = { x: 110, y: 95 }, fD = { x: 20, y: 95 };
    const bA = { x: 40, y: 20 }, bB = { x: 130, y: 20 }, bC = { x: 130, y: 75 }, bD = { x: 40, y: 75 };
    let hi = '';
    if (highlight === 'face') {
      // 앞면 강조
      hi = `<polygon points="${fA.x},${fA.y} ${fB.x},${fB.y} ${fC.x},${fC.y} ${fD.x},${fD.y}" fill="rgba(245,158,11,0.4)" stroke="#f59e0b" stroke-width="3"/>`;
    } else if (highlight === 'parallelFace') {
      // 앞면 + 뒷면 평행 강조
      hi = `
        <polygon points="${fA.x},${fA.y} ${fB.x},${fB.y} ${fC.x},${fC.y} ${fD.x},${fD.y}" fill="rgba(245,158,11,0.35)" stroke="#f59e0b" stroke-width="2.5"/>
        <polygon points="${bA.x},${bA.y} ${bB.x},${bB.y} ${bC.x},${bC.y} ${bD.x},${bD.y}" fill="rgba(245,158,11,0.35)" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="4,3"/>`;
    } else if (highlight === 'vertices') {
      const verts = [fA, fB, fC, fD, bA, bB, bC, bD];
      hi = verts.map(p => `<circle cx="${p.x}" cy="${p.y}" r="4.5" fill="#f59e0b" stroke="#d97706" stroke-width="1.5"/>`).join('');
    } else if (highlight === 'edges') {
      // 앞 4 + 뒤 4 + 옆 4 = 12 모서리
      const edges = [
        [fA, fB], [fB, fC], [fC, fD], [fD, fA],
        [bA, bB], [bB, bC], [bC, bD], [bD, bA],
        [fA, bA], [fB, bB], [fC, bC], [fD, bD],
      ];
      hi = edges.map(([p, q]) => `<line x1="${p.x}" y1="${p.y}" x2="${q.x}" y2="${q.y}" stroke="#f59e0b" stroke-width="3"/>`).join('');
    } else if (highlight === 'edgesAtVertex') {
      // 한 꼭짓점에 모이는 3 모서리 (fA 기준)
      hi = `
        <line x1="${fA.x}" y1="${fA.y}" x2="${fB.x}" y2="${fB.y}" stroke="#f59e0b" stroke-width="3.5"/>
        <line x1="${fA.x}" y1="${fA.y}" x2="${fD.x}" y2="${fD.y}" stroke="#f59e0b" stroke-width="3.5"/>
        <line x1="${fA.x}" y1="${fA.y}" x2="${bA.x}" y2="${bA.y}" stroke="#f59e0b" stroke-width="3.5"/>
        <circle cx="${fA.x}" cy="${fA.y}" r="5" fill="#f59e0b" stroke="#d97706" stroke-width="1.5"/>`;
    }
    const labels = showLabels && w != null ? `
      <text x="65" y="115" text-anchor="middle" font-size="11" fill="#1a1d2e" font-weight="700" font-family="system-ui">가로 ${w}${unit}</text>
      <text x="120" y="70" text-anchor="start" font-size="11" fill="#1a1d2e" font-weight="700" font-family="system-ui">세로 ${h}${unit}</text>
      <text x="142" y="35" text-anchor="middle" font-size="11" fill="#1a1d2e" font-weight="700" font-family="system-ui">높이 ${d}${unit}</text>` : '';
    return `
    <svg viewBox="0 0 160 130" xmlns="http://www.w3.org/2000/svg">
      <polygon points="${bA.x},${bA.y} ${bB.x},${bB.y} ${bC.x},${bC.y} ${bD.x},${bD.y}" fill="#dde0ff" stroke="#6366f1" stroke-width="2.5"/>
      <polygon points="${fA.x},${fA.y} ${bA.x},${bA.y} ${bB.x},${bB.y} ${fB.x},${fB.y}" fill="#c8cdff" stroke="#6366f1" stroke-width="2.5"/>
      <polygon points="${fA.x},${fA.y} ${fB.x},${fB.y} ${fC.x},${fC.y} ${fD.x},${fD.y}" fill="#eef0ff" stroke="#6366f1" stroke-width="2.5"/>
      ${hi}
      ${labels}
    </svg>`;
  },
  // 정육면체 (highlight 옵션 동일)
  cube: ({ side, unit = '', highlight, showLabels = false }) => {
    const fA = { x: 20, y: 50 }, fB = { x: 90, y: 50 }, fC = { x: 90, y: 110 }, fD = { x: 20, y: 110 };
    const bA = { x: 40, y: 30 }, bB = { x: 110, y: 30 }, bC = { x: 110, y: 90 }, bD = { x: 40, y: 90 };
    let hi = '';
    if (highlight === 'face') {
      hi = `<polygon points="${fA.x},${fA.y} ${fB.x},${fB.y} ${fC.x},${fC.y} ${fD.x},${fD.y}" fill="rgba(245,158,11,0.4)" stroke="#f59e0b" stroke-width="3"/>`;
    } else if (highlight === 'parallelFace') {
      hi = `
        <polygon points="${fA.x},${fA.y} ${fB.x},${fB.y} ${fC.x},${fC.y} ${fD.x},${fD.y}" fill="rgba(245,158,11,0.35)" stroke="#f59e0b" stroke-width="2.5"/>
        <polygon points="${bA.x},${bA.y} ${bB.x},${bB.y} ${bC.x},${bC.y} ${bD.x},${bD.y}" fill="rgba(245,158,11,0.35)" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="4,3"/>`;
    } else if (highlight === 'vertices') {
      const verts = [fA, fB, fC, fD, bA, bB, bC, bD];
      hi = verts.map(p => `<circle cx="${p.x}" cy="${p.y}" r="4.5" fill="#f59e0b" stroke="#d97706" stroke-width="1.5"/>`).join('');
    } else if (highlight === 'edges') {
      const edges = [
        [fA, fB], [fB, fC], [fC, fD], [fD, fA],
        [bA, bB], [bB, bC], [bC, bD], [bD, bA],
        [fA, bA], [fB, bB], [fC, bC], [fD, bD],
      ];
      hi = edges.map(([p, q]) => `<line x1="${p.x}" y1="${p.y}" x2="${q.x}" y2="${q.y}" stroke="#f59e0b" stroke-width="3"/>`).join('');
    }
    const labels = showLabels && side != null ? `<text x="70" y="125" text-anchor="middle" font-size="12" fill="#1a1d2e" font-weight="700" font-family="system-ui">한 모서리 ${side}${unit}</text>` : '';
    return `
    <svg viewBox="0 0 140 130" xmlns="http://www.w3.org/2000/svg">
      <polygon points="${bA.x},${bA.y} ${bB.x},${bB.y} ${bC.x},${bC.y} ${bD.x},${bD.y}" fill="#dde0ff" stroke="#6366f1" stroke-width="2.5"/>
      <polygon points="${fA.x},${fA.y} ${bA.x},${bA.y} ${bB.x},${bB.y} ${fB.x},${fB.y}" fill="#c8cdff" stroke="#6366f1" stroke-width="2.5"/>
      <polygon points="${fA.x},${fA.y} ${fB.x},${fB.y} ${fC.x},${fC.y} ${fD.x},${fD.y}" fill="#eef0ff" stroke="#6366f1" stroke-width="2.5"/>
      ${hi}
      ${labels}
    </svg>`;
  },
  // 각도 (한 각 표시) — deg: 각도 값, mark: 직각 표시
  angle: ({ deg, mark = false }) => {
    const cx = 30, cy = 100;
    const len = 80;
    const rad = -deg * Math.PI / 180;
    const ex = cx + len, ey = cy;
    const fx = cx + len * Math.cos(rad), fy = cy + len * Math.sin(rad);
    const arcR = 22;
    const ax1 = cx + arcR, ay1 = cy;
    const ax2 = cx + arcR * Math.cos(rad), ay2 = cy + arcR * Math.sin(rad);
    const large = deg > 180 ? 1 : 0;
    const rightMark = (mark && Math.abs(deg - 90) < 0.1)
      ? `<rect x="${cx}" y="${cy - 12}" width="12" height="12" fill="none" stroke="#f59e0b" stroke-width="2"/>`
      : '';
    return `
    <svg viewBox="0 0 140 120" xmlns="http://www.w3.org/2000/svg">
      <line x1="${cx}" y1="${cy}" x2="${ex}" y2="${ey}" stroke="#6366f1" stroke-width="3" stroke-linecap="round"/>
      <line x1="${cx}" y1="${cy}" x2="${fx.toFixed(1)}" y2="${fy.toFixed(1)}" stroke="#6366f1" stroke-width="3" stroke-linecap="round"/>
      <path d="M ${ax1} ${ay1} A ${arcR} ${arcR} 0 ${large} 0 ${ax2.toFixed(1)} ${ay2.toFixed(1)}" fill="none" stroke="#f59e0b" stroke-width="2.5"/>
      ${rightMark}
    </svg>`;
  },
  // 삼각형 + ? 각 강조 (두 각 라벨 없이, 미지의 각만 ? 로 표시)
  triangleAngles: () => `
    <svg viewBox="0 0 160 120" xmlns="http://www.w3.org/2000/svg">
      <polygon points="80,20 25,105 135,105" fill="#eef0ff" stroke="#6366f1" stroke-width="3" stroke-linejoin="round"/>
      <path d="M 38 100 A 14 14 0 0 0 50 95" fill="none" stroke="#f59e0b" stroke-width="2"/>
      <path d="M 110 95 A 14 14 0 0 0 122 100" fill="none" stroke="#f59e0b" stroke-width="2"/>
      <path d="M 73 36 A 12 12 0 0 0 87 36" fill="none" stroke="#ef4444" stroke-width="2.5"/>
      <text x="74" y="52" font-size="14" fill="#ef4444" font-weight="900" font-family="system-ui">?</text>
    </svg>`,
  // 직사각형 (대각선 강조 옵션)
  rectShape: ({ w = 5, h = 3, highlight }) => {
    const max = Math.max(w, h);
    const rw = (w / max) * 90, rh = (h / max) * 60;
    const x = (140 - rw) / 2, y = (110 - rh) / 2;
    let extra = '';
    if (highlight === 'diagonals') {
      extra = `
        <line x1="${x}" y1="${y}" x2="${x + rw}" y2="${y + rh}" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="4,3"/>
        <line x1="${x + rw}" y1="${y}" x2="${x}" y2="${y + rh}" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="4,3"/>`;
    } else if (highlight === 'angle') {
      extra = `<rect x="${x}" y="${y}" width="11" height="11" fill="none" stroke="#f59e0b" stroke-width="2"/>`;
    } else if (highlight === 'symmetry') {
      extra = `
        <line x1="${x + rw / 2}" y1="${y - 6}" x2="${x + rw / 2}" y2="${y + rh + 6}" stroke="#ef4444" stroke-width="1.6" stroke-dasharray="3,2"/>
        <line x1="${x - 6}" y1="${y + rh / 2}" x2="${x + rw + 6}" y2="${y + rh / 2}" stroke="#ef4444" stroke-width="1.6" stroke-dasharray="3,2"/>`;
    }
    return `
    <svg viewBox="0 0 140 110" xmlns="http://www.w3.org/2000/svg">
      <rect x="${x}" y="${y}" width="${rw}" height="${rh}" fill="#eef0ff" stroke="#6366f1" stroke-width="3" rx="3"/>
      ${extra}
    </svg>`;
  },
  // 평행사변형 (평행 변 강조 옵션)
  parallelogram: ({ highlight }) => {
    const pts = '40,30 115,30 100,90 25,90';
    let extra = '';
    if (highlight === 'parallel') {
      extra = `
        <line x1="40" y1="30" x2="115" y2="30" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
        <line x1="25" y1="90" x2="100" y2="90" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>`;
    }
    return `
    <svg viewBox="0 0 140 110" xmlns="http://www.w3.org/2000/svg">
      <polygon points="${pts}" fill="#eef0ff" stroke="#6366f1" stroke-width="3" stroke-linejoin="round"/>
      ${extra}
    </svg>`;
  },
  // 마름모 (대각선 = 대칭축)
  rhombus: ({ highlight }) => {
    const pts = '70,15 120,60 70,105 20,60';
    let extra = '';
    if (highlight === 'symmetry') {
      extra = `
        <line x1="70" y1="9" x2="70" y2="111" stroke="#ef4444" stroke-width="1.6" stroke-dasharray="3,2"/>
        <line x1="14" y1="60" x2="126" y2="60" stroke="#ef4444" stroke-width="1.6" stroke-dasharray="3,2"/>`;
    }
    return `
    <svg viewBox="0 0 140 120" xmlns="http://www.w3.org/2000/svg">
      <polygon points="${pts}" fill="#eef0ff" stroke="#6366f1" stroke-width="3" stroke-linejoin="round"/>
      ${extra}
    </svg>`;
  },
  // 사다리꼴 형태 (평행 변 강조)
  trapezoidShape: ({ highlight }) => {
    const pts = '50,20 100,20 130,80 20,80';
    let extra = '';
    if (highlight === 'parallel') {
      extra = `
        <line x1="50" y1="20" x2="100" y2="20" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
        <line x1="20" y1="80" x2="130" y2="80" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>`;
    }
    return `
    <svg viewBox="0 0 150 100" xmlns="http://www.w3.org/2000/svg">
      <polygon points="${pts}" fill="#eef0ff" stroke="#6366f1" stroke-width="3" stroke-linejoin="round"/>
      ${extra}
    </svg>`;
  },
  // n각기둥 (3D 비스듬, n=3~6)
  prism: ({ n = 4, highlight }) => {
    // 위 다각형 + 아래 다각형 + 옆면 모서리
    const cxT = 70, cyT = 35, RT = 28;
    const cxB = 70, cyB = 90, RB = 28;
    const top = [], bot = [];
    for (let i = 0; i < n; i++) {
      const a = -Math.PI / 2 + (i * 2 * Math.PI / n);
      // 위는 살짝 납작하게
      top.push({ x: cxT + RT * Math.cos(a) * 1.2, y: cyT + RT * Math.sin(a) * 0.45 });
      bot.push({ x: cxB + RB * Math.cos(a) * 1.2, y: cyB + RB * Math.sin(a) * 0.45 });
    }
    const topStr = top.map(p => `${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ');
    const botStr = bot.map(p => `${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ');
    // 세로 모서리
    const sides = top.map((p, i) => {
      const q = bot[i];
      return `<line x1="${p.x.toFixed(1)}" y1="${p.y.toFixed(1)}" x2="${q.x.toFixed(1)}" y2="${q.y.toFixed(1)}" stroke="#6366f1" stroke-width="2.5"/>`;
    }).join('');

    let hi = '';
    if (highlight === 'vertices') {
      hi = [...top, ...bot].map(p => `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="4.5" fill="#f59e0b" stroke="#d97706" stroke-width="1.5"/>`).join('');
    } else if (highlight === 'edges') {
      // 모든 모서리(옆 + 위 + 아래)를 주황
      hi = sides.replace(/stroke="#6366f1"/g, 'stroke="#f59e0b"').replace(/stroke-width="2.5"/g, 'stroke-width="3.5"');
      hi += `<polygon points="${topStr}" fill="none" stroke="#f59e0b" stroke-width="3.5"/>`;
      hi += `<polygon points="${botStr}" fill="none" stroke="#f59e0b" stroke-width="3.5"/>`;
    } else if (highlight === 'faces') {
      // 옆면 한 개 강조 (첫 번째)
      const p1 = top[0], p2 = top[1 % n], p3 = bot[1 % n], p4 = bot[0];
      hi = `<polygon points="${p1.x.toFixed(1)},${p1.y.toFixed(1)} ${p2.x.toFixed(1)},${p2.y.toFixed(1)} ${p3.x.toFixed(1)},${p3.y.toFixed(1)} ${p4.x.toFixed(1)},${p4.y.toFixed(1)}" fill="rgba(245,158,11,0.35)" stroke="#f59e0b" stroke-width="2"/>`;
    }
    return `
    <svg viewBox="0 0 140 130" xmlns="http://www.w3.org/2000/svg">
      <polygon points="${botStr}" fill="#dde0ff" stroke="#6366f1" stroke-width="2.5"/>
      ${sides}
      <polygon points="${topStr}" fill="#eef0ff" stroke="#6366f1" stroke-width="2.5"/>
      ${hi}
    </svg>`;
  },
  // n각뿔 (3D 비스듬)
  pyramid: ({ n = 4, highlight }) => {
    const cx = 70, cy = 90, R = 30;
    const apex = { x: 70, y: 18 };
    const base = [];
    for (let i = 0; i < n; i++) {
      const a = -Math.PI / 2 + (i * 2 * Math.PI / n);
      base.push({ x: cx + R * Math.cos(a) * 1.3, y: cy + R * Math.sin(a) * 0.5 });
    }
    const baseStr = base.map(p => `${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ');
    const sides = base.map(p => `<line x1="${apex.x}" y1="${apex.y}" x2="${p.x.toFixed(1)}" y2="${p.y.toFixed(1)}" stroke="#6366f1" stroke-width="2.5"/>`).join('');

    let hi = '';
    if (highlight === 'vertices') {
      hi = [apex, ...base].map(p => `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="4.5" fill="#f59e0b" stroke="#d97706" stroke-width="1.5"/>`).join('');
    } else if (highlight === 'edges') {
      hi = sides.replace(/stroke="#6366f1"/g, 'stroke="#f59e0b"').replace(/stroke-width="2.5"/g, 'stroke-width="3.5"');
      hi += `<polygon points="${baseStr}" fill="none" stroke="#f59e0b" stroke-width="3.5"/>`;
    } else if (highlight === 'faces') {
      // 옆면 하나 강조
      const p1 = base[0], p2 = base[1 % n];
      hi = `<polygon points="${apex.x},${apex.y} ${p1.x.toFixed(1)},${p1.y.toFixed(1)} ${p2.x.toFixed(1)},${p2.y.toFixed(1)}" fill="rgba(245,158,11,0.35)" stroke="#f59e0b" stroke-width="2"/>`;
    }
    return `
    <svg viewBox="0 0 140 120" xmlns="http://www.w3.org/2000/svg">
      <polygon points="${baseStr}" fill="#dde0ff" stroke="#6366f1" stroke-width="2.5"/>
      ${sides}
      ${hi}
    </svg>`;
  },
  // 점/사물 카운트 (1학년 수 세기)
  dots: ({ count }) => {
    const cells = [];
    const cols = Math.min(5, count);
    const rows = Math.ceil(count / cols);
    const cellSize = 24;
    const startX = (140 - cols * cellSize) / 2;
    const startY = (100 - rows * cellSize) / 2;
    for (let i = 0; i < count; i++) {
      const r = Math.floor(i / cols);
      const c = i % cols;
      cells.push(`<circle cx="${startX + c * cellSize + cellSize/2}" cy="${startY + r * cellSize + cellSize/2}" r="9" fill="#f59e0b" stroke="#d97706" stroke-width="1.5"/>`);
    }
    return `
    <svg viewBox="0 0 140 100" xmlns="http://www.w3.org/2000/svg">
      ${cells.join('')}
    </svg>`;
  },
};

function renderVisual(visual) {
  if (!visual || !VISUAL[visual.type]) return '';
  return VISUAL[visual.type](visual);
}

// =============================================================
// 오답 시 풀이/공식 자동 생성 — 문제 패턴을 인식해 한국어 풀이 반환
// =============================================================
function getExplanation(problem) {
  const q = problem.q;
  const a = String(problem.a);
  // 3단 카드 빌더
  const card = (formula, solution, answer) => {
    let html = '';
    if (formula) html += `<div class="exp-row"><span class="exp-tag">공식</span><span class="exp-content">${formula}</span></div>`;
    if (solution) html += `<div class="exp-row"><span class="exp-tag">풀이</span><span class="exp-content">${solution}</span></div>`;
    html += `<div class="exp-row exp-final"><span class="exp-tag">답</span><span class="exp-content"><b>${answer}</b></span></div>`;
    return html;
  };

  // 1) 두 수 사칙연산: a OP b = ?
  let m = q.match(/^(\d+)\s*([+\-×÷])\s*(\d+)\s*=\s*\?$/);
  if (m) {
    const n1 = +m[1], op = m[2], n2 = +m[3];
    if (op === '+') return card(null, `${n1} + ${n2}`, `${n1+n2}`);
    if (op === '-') return card(null, `${n1} - ${n2}`, `${n1-n2}`);
    if (op === '×') return card(`a × b는 a를 b번 더하기`, `${n1} + ${n1} + ... (${n2}번) = ${n1*n2}`, `${n1*n2}`);
    if (op === '÷') return card(`A ÷ B는 B × ? = A 인 ?`, `${n2} × ${n1/n2} = ${n1}`, `${n1/n2}`);
  }
  // 2) 빈칸 문제: a + ? = c
  m = q.match(/^(\d+)\s*([+\-×÷])\s*\?\s*=\s*(\d+)$/);
  if (m) {
    const a1 = +m[1], op = m[2], c = +m[3];
    if (op === '+') return card(`a + ? = c → ? = c - a`, `${c} - ${a1} = ${c - a1}`, `${c - a1}`);
    if (op === '-') return card(`a - ? = c → ? = a - c`, `${a1} - ${c} = ${a1 - c}`, `${a1 - c}`);
    if (op === '×') return card(`a × ? = c → ? = c ÷ a`, `${c} ÷ ${a1} = ${c / a1}`, `${c / a1}`);
    if (op === '÷') return card(`a ÷ ? = c → ? = a ÷ c`, `${a1} ÷ ${c} = ${a1 / c}`, `${a1 / c}`);
  }
  // 3) 세 수 연산
  m = q.match(/^(\d+)\s*([+\-])\s*(\d+)\s*([+\-])\s*(\d+)\s*=\s*\?$/);
  if (m) {
    let v = +m[1];
    const s1 = m[2] === '+' ? v + +m[3] : v - +m[3];
    const s2 = m[4] === '+' ? s1 + +m[5] : s1 - +m[5];
    return card('왼쪽부터 차례대로 계산', `${m[1]} ${m[2]} ${m[3]} = ${s1}<br>${s1} ${m[4]} ${m[5]} = ${s2}`, `${s2}`);
  }
  // 4) 분수 덧뺄셈
  m = q.match(/^(\d+)\/(\d+)\s*([+\-])\s*(\d+)\/(\d+)\s*=/);
  if (m) {
    const n1 = +m[1], d1 = +m[2], op = m[3], n2 = +m[4], d2 = +m[5];
    if (d1 === d2) {
      const sumN = op === '+' ? n1 + n2 : n1 - n2;
      return card(`분모가 같으면 분자끼리 ${op}`,
        `${n1}/${d1} ${op} ${n2}/${d1} = ${sumN}/${d1}`,
        a);
    }
    const lcm = d1 * d2, newN1 = n1*d2, newN2 = n2*d1;
    const sumN = op === '+' ? newN1 + newN2 : newN1 - newN2;
    return card(`이분모: 분모를 ${lcm} 로 통분`,
      `${newN1}/${lcm} ${op} ${newN2}/${lcm} = ${sumN}/${lcm}`,
      a);
  }
  // 5) 분수 × 분수
  m = q.match(/^(\d+)\/(\d+)\s*×\s*(\d+)\/(\d+)/);
  if (m) {
    const n1 = +m[1], d1 = +m[2], n2 = +m[3], d2 = +m[4];
    return card(`분자×분자 / 분모×분모`,
      `${n1}×${n2} / ${d1}×${d2} = ${n1*n2}/${d1*d2}`,
      a);
  }
  // 5b) 분수 × 자연수
  m = q.match(/^(\d+)\/(\d+)\s*×\s*(\d+)\s*=/);
  if (m) {
    const n = +m[1], d = +m[2], k = +m[3];
    return card(`분수 × 자연수: 분자에만 곱하기`,
      `${n}×${k} / ${d} = ${n*k}/${d}`,
      a);
  }
  // 6) 분수 나눗셈
  m = q.match(/^(\d+)\/(\d+)\s*÷\s*(\d+)\/(\d+)/);
  if (m) {
    const n1 = +m[1], d1 = +m[2], n2 = +m[3], d2 = +m[4];
    return card(`÷ 뒤 분수의 분자/분모를 뒤집어 곱하기`,
      `${n1}/${d1} × ${d2}/${n2} = ${n1*d2}/${d1*n2}`,
      a);
  }
  // 7) 소수 사칙
  m = q.match(/^(\d+(?:\.\d+)?)\s*([+\-×÷])\s*(\d+(?:\.\d+)?)\s*=/);
  if (m) {
    const n1 = m[1], op = m[2], n2 = m[3];
    if (op === '+') return card('소수점을 맞추고 자릿수대로 더하기', `${n1} + ${n2}`, a);
    if (op === '-') return card('소수점을 맞추고 자릿수대로 빼기', `${n1} - ${n2}`, a);
    if (op === '×') return card('자연수처럼 곱한 뒤 소수점 자릿수 합만큼 이동', `${n1} × ${n2}`, a);
    if (op === '÷') return card('양쪽 소수점을 같은 자리만큼 옮겨 자연수로 만들고 나누기', `${n1} ÷ ${n2}`, a);
  }
  // 8) 도형 둘레
  if (q.includes('정사각형') && q.includes('둘레')) {
    const sm = q.match(/한 변이 (\d+)/);
    const s = sm ? +sm[1] : null;
    return card('정사각형 둘레 = 한 변 × 4',
      s ? `${s} × 4 = ${s*4}` : null, a);
  }
  if (q.includes('직사각형') && q.includes('둘레')) {
    const wm = q.match(/가로 (\d+)/), hm = q.match(/세로 (\d+)/);
    const w = wm ? +wm[1] : null, h = hm ? +hm[1] : null;
    return card('직사각형 둘레 = (가로 + 세로) × 2',
      w!=null && h!=null ? `(${w} + ${h}) × 2 = ${(w+h)*2}` : null, a);
  }
  if (q.includes('정삼각형') && q.includes('둘레')) {
    const sm = q.match(/한 변이 (\d+)/);
    const s = sm ? +sm[1] : null;
    return card('정삼각형 둘레 = 한 변 × 3',
      s ? `${s} × 3 = ${s*3}` : null, a);
  }
  // 도형 넓이
  if (q.includes('정사각형') && q.includes('넓이')) {
    const sm = q.match(/한 변 (\d+)/);
    const s = sm ? +sm[1] : null;
    return card('정사각형 넓이 = 한 변 × 한 변',
      s ? `${s} × ${s} = ${s*s}` : null, a);
  }
  if (q.includes('직사각형') && q.includes('넓이')) {
    const m1 = q.match(/(\d+)\s*[×x]\s*(\d+)/) || q.match(/가로 (\d+).*세로 (\d+)/);
    if (m1) {
      const w = +m1[1], h = +m1[2];
      return card('직사각형 넓이 = 가로 × 세로', `${w} × ${h} = ${w*h}`, a);
    }
    return card('직사각형 넓이 = 가로 × 세로', null, a);
  }
  if (q.includes('삼각형') && q.includes('넓이')) {
    const m1 = q.match(/밑변 (\d+).*높이 (\d+)/);
    if (m1) {
      const b = +m1[1], h = +m1[2];
      return card('삼각형 넓이 = 밑변 × 높이 ÷ 2', `${b} × ${h} ÷ 2 = ${b*h/2}`, a);
    }
    return card('삼각형 넓이 = 밑변 × 높이 ÷ 2', null, a);
  }
  if (q.includes('사다리꼴') && q.includes('넓이')) {
    const m1 = q.match(/평행한 두 변이 (\d+),\s*(\d+).*높이가 (\d+)/);
    if (m1) {
      const t = +m1[1], b = +m1[2], h = +m1[3];
      return card('사다리꼴 넓이 = (윗변 + 아랫변) × 높이 ÷ 2',
        `(${t} + ${b}) × ${h} ÷ 2 = ${(t+b)*h/2}`, a);
    }
    return card('사다리꼴 넓이 = (윗변 + 아랫변) × 높이 ÷ 2', null, a);
  }
  if (q.includes('평행사변형') && q.includes('넓이')) {
    return card('평행사변형 넓이 = 밑변 × 높이', null, a);
  }
  // 원
  if (q.includes('원') && q.includes('둘레')) {
    const rm = q.match(/반지름 (\d+)/), dm = q.match(/지름 (\d+)/);
    if (rm) {
      const r = +rm[1];
      return card('원의 둘레 = 반지름 × 2 × π (π=3.14)',
        `${r} × 2 × 3.14 = ${(r*2*3.14).toFixed(2)}`, a);
    }
    if (dm) {
      const d = +dm[1];
      return card('원의 둘레 = 지름 × π (π=3.14)',
        `${d} × 3.14 = ${(d*3.14).toFixed(2)}`, a);
    }
    return card('원의 둘레 = 지름 × π (π=3.14)', null, a);
  }
  if (q.includes('원') && q.includes('넓이')) {
    const rm = q.match(/반지름 (\d+)/);
    if (rm) {
      const r = +rm[1];
      return card('원의 넓이 = 반지름 × 반지름 × π (π=3.14)',
        `${r} × ${r} × 3.14 = ${(r*r*3.14).toFixed(2)}`, a);
    }
    return card('원의 넓이 = 반지름² × π', null, a);
  }
  // 부피·겉넓이
  if (q.includes('직육면체') && q.includes('부피')) {
    const m1 = q.match(/가로 (\d+).*세로 (\d+).*높이 (\d+)/);
    if (m1) {
      const w = +m1[1], h = +m1[2], d = +m1[3];
      return card('직육면체 부피 = 가로 × 세로 × 높이',
        `${w} × ${h} × ${d} = ${w*h*d}`, a);
    }
    return card('직육면체 부피 = 가로 × 세로 × 높이', null, a);
  }
  if (q.includes('정육면체') && q.includes('부피')) {
    const sm = q.match(/한 모서리[가는]?\s*(\d+)/);
    if (sm) {
      const s = +sm[1];
      return card('정육면체 부피 = 한 모서리 × 한 모서리 × 한 모서리',
        `${s} × ${s} × ${s} = ${s*s*s}`, a);
    }
    return card('정육면체 부피 = 한 모서리³', null, a);
  }
  if (q.includes('겉넓이')) {
    const m1 = q.match(/가로 (\d+).*세로 (\d+).*높이 (\d+)/);
    if (m1) {
      const w = +m1[1], h = +m1[2], d = +m1[3];
      return card('직육면체 겉넓이 = 2 × (가로×세로 + 세로×높이 + 가로×높이)',
        `2 × (${w}×${h} + ${h}×${d} + ${w}×${d}) = ${2*(w*h+h*d+w*d)}`, a);
    }
    return card('직육면체 겉넓이 = 2 × (가로×세로 + 세로×높이 + 가로×높이)', null, a);
  }
  // 시간
  if (q.match(/(\d+)시간\s*(\d+)분/)) {
    const tm = q.match(/(\d+)시간\s*(\d+)분/);
    const h = +tm[1], mn = +tm[2];
    return card('1시간 = 60분', `${h} × 60 + ${mn} = ${h*60+mn}`, a);
  }
  if (q.match(/(\d+)분 = 1시간/)) {
    const tm = q.match(/(\d+)분/);
    const m1 = +tm[1];
    return card('1시간 = 60분', `${m1} - 60 = ${m1-60}`, a);
  }
  // 길이
  if (q.match(/(\d+)m\s*(\d+)cm = \?/)) {
    const tm = q.match(/(\d+)m\s*(\d+)cm/);
    const mm = +tm[1], cm = +tm[2];
    return card('1m = 100cm', `${mm} × 100 + ${cm} = ${mm*100+cm}`, a);
  }
  // 각형 변/꼭짓점/내각
  if (q.includes('각형')) {
    const nm = q.match(/(\d+)각형|(\S{1,2})각형/);
    let n = null;
    if (nm) {
      const w = nm[2] || nm[1];
      const ko = {'삼':3,'사':4,'오':5,'육':6,'칠':7,'팔':8};
      n = ko[w] != null ? ko[w] : (+w || null);
    }
    if (q.includes('내각의 합')) {
      return card('n각형 내각의 합 = (n - 2) × 180°',
        n ? `(${n} - 2) × 180 = ${(n-2)*180}` : null, a);
    }
    if (q.includes('대각선')) {
      return card('n각형 대각선 수 = n × (n - 3) ÷ 2',
        n ? `${n} × (${n} - 3) ÷ 2 = ${n*(n-3)/2}` : null, a);
    }
    if (q.includes('변') || q.includes('꼭짓점') || q.includes('각')) {
      return card('n각형: 변 = 꼭짓점 = 각의 수 = n', n ? `n = ${n}` : null, a);
    }
  }
  // 직육면체 / 정육면체 성질
  if (q.includes('직육면체') || q.includes('정육면체')) {
    return card('직육면체: 면 6, 꼭짓점 8, 모서리 12 (정육면체도 같음)', null, a);
  }
  // 각기둥
  if (q.includes('각기둥')) {
    const nm = q.match(/(\d+)각기둥/);
    const n = nm ? +nm[1] : null;
    if (q.includes('면')) return card('n각기둥 면 = n + 2', n ? `${n} + 2 = ${n+2}` : null, a);
    if (q.includes('꼭짓점')) return card('n각기둥 꼭짓점 = 2n', n ? `2 × ${n} = ${2*n}` : null, a);
    if (q.includes('모서리')) return card('n각기둥 모서리 = 3n', n ? `3 × ${n} = ${3*n}` : null, a);
  }
  // 각뿔
  if (q.includes('각뿔')) {
    const nm = q.match(/(\d+)각뿔/);
    const n = nm ? +nm[1] : null;
    if (q.includes('면')) return card('n각뿔 면 = n + 1 (밑면 1 + 옆면 n)', n ? `${n} + 1 = ${n+1}` : null, a);
    if (q.includes('꼭짓점')) return card('n각뿔 꼭짓점 = n + 1', n ? `${n} + 1 = ${n+1}` : null, a);
    if (q.includes('모서리')) return card('n각뿔 모서리 = 2n', n ? `2 × ${n} = ${2*n}` : null, a);
  }
  // 쌓기나무
  if (q.includes('쌓기나무')) {
    const cube = q.match(/한 모서리[가는]?\s*(\d+)인 정육면체/);
    if (cube) {
      const n = +cube[1];
      return card('정육면체 쌓기나무 = n × n × n', `${n} × ${n} × ${n} = ${n*n*n}`, a);
    }
    const rect = q.match(/가로 (\d+).*세로 (\d+).*높이 (\d+)/);
    if (rect) {
      const w = +rect[1], h = +rect[2], d = +rect[3];
      return card('쌓기나무 = 가로 × 세로 × 높이',
        `${w} × ${h} × ${d} = ${w*h*d}`, a);
    }
    const layer = q.match(/한 층에 (\d+)개씩 (\d+)층/);
    if (layer) {
      const base = +layer[1], floors = +layer[2];
      return card('쌓기나무 = 한 층 개수 × 층 수',
        `${base} × ${floors} = ${base*floors}`, a);
    }
    const remove = q.match(/한 모서리 (\d+).*한 모서리 (\d+)/);
    if (remove) {
      const big = +remove[1], small = +remove[2];
      return card('큰 정육면체 - 작은 정육면체',
        `${big}³ - ${small}³ = ${big**3} - ${small**3} = ${big**3 - small**3}`, a);
    }
  }
  // 비례식
  m = q.match(/^(\d+)\s*:\s*(\d+)\s*=\s*(\d+)\s*:\s*\?/);
  if (m) {
    const a1 = +m[1], b = +m[2], c = +m[3];
    const k = c / a1;
    return card('a:b = c:? → ? = b × (c ÷ a)',
      `? = ${b} × (${c} ÷ ${a1}) = ${b} × ${k} = ${b*k}`, a);
  }
  // 백분율
  m = q.match(/(\d+)의\s*(\d+)%/);
  if (m) {
    const total = +m[1], pct = +m[2];
    return card('전체 × 백분율 ÷ 100',
      `${total} × ${pct} ÷ 100 = ${total*pct/100}`, a);
  }
  m = q.match(/전체\s*(\d+)\s*중\s*(\d+)/);
  if (m) {
    const total = +m[1], part = +m[2];
    return card('비율(%) = (부분 ÷ 전체) × 100',
      `${part} ÷ ${total} × 100 = ${(part/total*100).toFixed(1)}`, a);
  }
  // 평균
  if (q.includes('평균')) {
    const nums = (q.match(/(\d+(?:,\s*\d+)+)/) || [''])[0].split(',').map(s => +s.trim()).filter(Boolean);
    if (nums.length >= 2) {
      const sum = nums.reduce((s,x)=>s+x,0);
      return card('평균 = 합 ÷ 개수',
        `(${nums.join(' + ')}) ÷ ${nums.length} = ${sum} ÷ ${nums.length} = ${sum/nums.length}`, a);
    }
    return card('평균 = 모든 수의 합 ÷ 개수', null, a);
  }
  // 약수/배수
  if (q.includes('최대공약수')) {
    return card('두 수를 동시에 나눌 수 있는 가장 큰 수', '공약수 중 최댓값', a);
  }
  if (q.includes('최소공배수')) {
    return card('두 수의 공통된 배수 중 가장 작은 수', '공배수 중 최솟값', a);
  }
  if (q.includes('약수의 개수')) {
    return card('어떤 수를 나누어떨어지게 하는 모든 수의 개수', null, a);
  }
  // 각도
  if (q.includes('직각')) return card('직각 = 90°', null, a);
  if (q.includes('직각에') && q.includes('°')) {
    const am = q.match(/(\d+)°/);
    if (am) {
      const x = +am[1];
      return card('직각 + x° = 90 + x°', `90 + ${x} = ${90+x}`, a);
    }
  }
  if (q.match(/삼각형의 두 각이 (\d+)°와 (\d+)°/)) {
    const tm = q.match(/(\d+)°와 (\d+)°/);
    const a1 = +tm[1], a2 = +tm[2];
    return card('삼각형 내각의 합 = 180°',
      `180 - ${a1} - ${a2} = ${180-a1-a2}`, a);
  }
  if (q.includes('삼각형') && q.includes('°')) return card('삼각형 내각의 합 = 180°', null, a);
  if (q.includes('사각형') && q.includes('°')) return card('사각형 내각의 합 = 360°', null, a);
  // 대칭
  if (q.includes('대칭축')) {
    const map = {'정삼각형':3,'정사각형':4,'정오각형':5,'정육각형':6,'직사각형':2,'마름모':2};
    for (const [k,v] of Object.entries(map)) {
      if (q.includes(k)) return card(`${k}의 대칭축 = ${v}개`, null, a);
    }
    return card('정n각형의 대칭축 = n개', null, a);
  }
  // 수열
  if (q.includes('앞 두 수의 합')) return card('피보나치 규칙: 앞의 두 수를 더한 값', '예: 1, 1, 2, 3, 5, 8 ...', a);
  if (q.includes('제곱수')) return card('제곱수: n² = n × n', '1, 4, 9, 16, 25, 36 ...', a);
  if (q.includes('규칙') || q.includes('곱하는')) {
    const seq = q.match(/^([\d, ]+),\s*\?/);
    if (seq) {
      const nums = seq[1].split(',').map(s => +s.trim()).filter(Boolean);
      if (nums.length >= 2) {
        const diff = nums[1] - nums[0];
        const ratio = nums[0] !== 0 ? nums[1] / nums[0] : null;
        if (nums.every((v, i) => i === 0 || v - nums[i-1] === diff)) {
          return card(`등차수열: 차이 ${diff} 만큼 더하기`,
            `${nums[nums.length-1]} + ${diff} = ${nums[nums.length-1]+diff}`, a);
        }
        if (ratio && nums.every((v, i) => i === 0 || v / nums[i-1] === ratio)) {
          return card(`등비수열: ${ratio} 만큼 곱하기`,
            `${nums[nums.length-1]} × ${ratio} = ${nums[nums.length-1]*ratio}`, a);
        }
      }
    }
    return card('숫자 사이의 일정한 차이 또는 비율을 찾기', null, a);
  }
  // 50까지의 수
  if (q.includes('10이') && q.includes('1이')) {
    const tm = q.match(/10이 (\d+)개,\s*1이 (\d+)개/);
    if (tm) {
      const t = +tm[1], o = +tm[2];
      return card('10이 a개, 1이 b개 → a × 10 + b',
        `${t} × 10 + ${o} = ${t*10+o}`, a);
    }
  }
  if (q.includes('큰 수')) {
    const nm = q.match(/(\d+)에서 1 큰 수/) || q.match(/(\d+)보다 (\d+)\s*큰/);
    if (nm && nm[2]) {
      return card('a 보다 b 큰 수 = a + b', `${nm[1]} + ${nm[2]} = ${+nm[1]+ +nm[2]}`, a);
    }
    if (nm) return card('n에서 1 큰 수 = n + 1', `${nm[1]} + 1 = ${+nm[1]+1}`, a);
  }
  if (q.includes('작은 수')) {
    const nm = q.match(/(\d+)보다 1 작은/);
    if (nm) return card('n보다 1 작은 수 = n - 1', `${nm[1]} - 1 = ${+nm[1]-1}`, a);
  }
  // 사고력 문장제
  if (q.includes('나눠')) {
    const ms = q.match(/(\d+)자루를 친구 (\d+)명/);
    if (ms) return card('전체 ÷ 사람 수',
      `${ms[1]} ÷ ${ms[2]} = ${+ms[1]/+ms[2]}`, a);
    return card('전체 ÷ 사람 수 = 한 명당 개수', null, a);
  }
  if (q.includes('상자')) {
    const ms = q.match(/(\d+)개씩 (\d+)상자/);
    if (ms) return card('한 상자 개수 × 상자 수',
      `${ms[1]} × ${ms[2]} = ${+ms[1]*+ms[2]}`, a);
    return card('한 상자 개수 × 상자 수', null, a);
  }
  if (q.includes('원짜리')) {
    const ms = q.match(/(\d+)원짜리.*(\d+)개/);
    if (ms) return card('가격 × 개수',
      `${ms[1]} × ${ms[2]} = ${+ms[1]*+ms[2]}`, a);
    return card('가격 × 개수 = 총 금액', null, a);
  }
  if (q.includes('잃어') || (q.includes('남은') && q.match(/(\d+).*(\d+)/))) {
    const ms = q.match(/(\d+)개\s*중\s*(\d+)개/);
    if (ms) return card('처음 - 사라진 수 = 남은 수',
      `${ms[1]} - ${ms[2]} = ${+ms[1]-+ms[2]}`, a);
  }
  if (q.includes('버스') && q.includes('명씩')) {
    const ms = q.match(/(\d+)대.*?(\d+)명씩/);
    if (ms) return card('대수 × 1대당 인원',
      `${ms[1]} × ${ms[2]} = ${+ms[1]*+ms[2]}`, a);
  }
  // 기본
  return card(null, null, a);
}

// 정답 시 답 박스 주변에 작은 스파클 띄우기
function spawnSparkles(targetEl) {
  if (!targetEl) return;
  const rect = targetEl.getBoundingClientRect();
  const appRect = document.getElementById('app').getBoundingClientRect();
  const cx = rect.left + rect.width / 2 - appRect.left;
  const cy = rect.top + rect.height / 2 - appRect.top;
  const sparkles = ['✨','⭐','💫','🌟'];
  const count = 8;
  for (let i = 0; i < count; i++) {
    const s = document.createElement('div');
    s.className = 'sparkle';
    s.textContent = sparkles[i % sparkles.length];
    const angle = (i / count) * Math.PI * 2 + Math.random() * 0.4;
    const distance = 60 + Math.random() * 50;
    const tx = Math.cos(angle) * distance;
    const ty = Math.sin(angle) * distance;
    s.style.left = cx + 'px';
    s.style.top = cy + 'px';
    s.style.setProperty('--tx', tx + 'px');
    s.style.setProperty('--ty', ty + 'px');
    s.style.animationDelay = (i * 0.03) + 's';
    document.getElementById('app').appendChild(s);
    setTimeout(() => s.remove(), 900);
  }
}

function submitAnswer(state, isTimeout = false) {
  if (!isTimeout && (currentAnswer === '' || currentAnswer === '-')) return;
  // 타이머 정리
  if (window.__playTimerId) { clearTimeout(window.__playTimerId); window.__playTimerId = null; }

  const problem = state.problems[state.idx];
  const isCorrect = !isTimeout && checkAnswer(currentAnswer, problem.a);
  const box = document.getElementById('ansBox');
  const feedback = document.getElementById('feedback');
  const area = document.getElementById('problemArea');

  // 응답 시간 측정 (스피드 보너스)
  const elapsedMs = Date.now() - (state.questionStartTime || Date.now());
  const elapsedSec = elapsedMs / 1000;

  // 객관식이면 보기 버튼에 정답/오답 시각 표시
  if (problem.choices) {
    const correctStr = String(problem.a);
    document.querySelectorAll('.mcq-option').forEach(b => {
      if (b.textContent === correctStr) b.classList.add('mcq-correct');
      else if (b.classList.contains('chosen')) b.classList.add('mcq-wrong');
    });
  }

  // 단원별 정답률 누적 (데일리 챌린지 제외)
  if (!state.isDaily && state.unit) {
    const up = getUnitProgress(state.unit.id);
    setUnitProgress(state.unit.id, {
      attempts: (up.attempts || 0) + 1,
      correct: (up.correct || 0) + (isCorrect ? 1 : 0),
    });
  }

  if (isCorrect) {
    box.classList.add('correct');
    // 스피드 보너스
    let speedMul = 1.0;
    let speedLabel = '';
    if (elapsedSec < 3) { speedMul = 1.5; speedLabel = '  ⚡ 1.5x'; SAVE.stats.fastAnswers++; }
    else if (elapsedSec < 6) { speedMul = 1.2; speedLabel = '  🏃 1.2x'; }
    // 콤보·시점에 따른 격려 메시지 다양화
    feedback.textContent = pickEncouragement(state.combo + 1, elapsedSec) + speedLabel;
    feedback.className = 'feedback correct show';
    area.classList.add('pop');
    // 정답 스파클 효과
    spawnSparkles(box);
    state.results[state.idx] = true;
    state.combo++;
    // 통계
    SAVE.stats.correctCount++;
    if (state.combo > SAVE.stats.maxCombo) SAVE.stats.maxCombo = state.combo;
    // 복습 큐: 정답 시 attempts++ (3회 통과 시 자동 제거)
    if (problem.__review && state.unit) markReviewSolved(state.unit.id, problem);
    saveSave(SAVE);
    // 사운드
    if (state.combo >= 5 && state.combo % 5 === 0) playCombo(Math.min(5, Math.ceil(state.combo / 5)));
    else if (state.combo >= 3) { playCorrect(); setTimeout(() => playTone(1760, 60), 140); }
    else playCorrect();
    // 코인: 기본 10 + stage*2, 콤보 보너스 + 스피드 보너스 + 보스 보너스
    const comboMul = state.combo >= 5 ? 3 : state.combo >= 3 ? 2 : 1;
    const bossMul = state.isBoss || state.isDaily ? 2 : 1;
    const earned = Math.round((10 + state.stage * 2) * comboMul * speedMul * bossMul);
    state.coinsEarned += earned;
    checkBadges();
  } else {
    box.classList.add('wrong');
    feedback.innerHTML = (isTimeout ? '⏰ 시간초과! 정답: ' : '❌ 정답: ') + formatMath(String(problem.a));
    feedback.className = 'feedback wrong show';
    area.classList.add('shake');
    state.results[state.idx] = false;
    state.combo = 0;
    state.hearts--;
    playWrong();
    // 오답 → 복습 큐에 추가 (데일리 챌린지 제외)
    if (!state.isDaily && state.unit) addToReviewQueue(state.unit.id, problem);
    // 풀이/공식 카드 표시
    showExplanationCard(area, problem);
  }

  setTimeout(() => {
    area.classList.remove('shake', 'pop');
    feedback.classList.remove('show');
    // 풀이 카드 정리
    const expCard = document.querySelector('.explanation-card');
    if (expCard) expCard.remove();
    state.idx++;
    if (state.hearts <= 0) {
      render(screenResult(state, false));
    } else if (state.idx >= state.problems.length) {
      render(screenResult(state, true));
    } else {
      render(screenPlay(state));
    }
  }, isCorrect ? 900 : 4200);  // 오답 시 풀이 읽을 시간 충분히 확보
}

// 풀이 카드 띄우기 (오답일 때) — getExplanation이 이미 3단 구조 HTML을 반환
function showExplanationCard(area, problem) {
  const card = document.createElement('div');
  card.className = 'explanation-card';
  card.innerHTML = getExplanation(problem);
  area.appendChild(card);
  requestAnimationFrame(() => card.classList.add('show'));
}

// ---------- Result ----------
function screenResult(state, completed) {
  const correctCount = state.results.filter(r => r === true).length;
  const total = state.problems.length;
  // 통과 기준: 일반 5문제 중 3, 보스/데일리 7문제 중 5
  const passThreshold = (state.isBoss || state.isDaily) ? 5 : 3;
  const passed = completed && correctCount >= passThreshold;
  let stars = 0;
  if (passed) {
    const fullCorrect = total; // 5 or 7
    if (correctCount === fullCorrect && state.hearts === 3) stars = 3;
    else if (correctCount >= fullCorrect - 1) stars = 2;
    else stars = 1;
  }
  const isPerfect = passed && correctCount === total && state.hearts === 3;

  // 이전 랭크를 기억해뒀다가 랭크업 감지
  const prevRank = getCurrentRank();

  // Save progress
  if (passed) {
    SAVE.coins += state.coinsEarned;
    if (state.isDaily) {
      // 데일리 챌린지 클리어
      SAVE.dailyChallenge.completed = true;
      SAVE.dailyChallenge.date = todayStr();
      SAVE.stats.dailyCompletions = (SAVE.stats.dailyCompletions || 0) + 1;
    } else {
      // 일반/보스: 단원 진행도 갱신 + 연속 실패 카운터 리셋
      const prev = getUnitProgress(state.unit.id);
      const newStars = Math.max(prev.stars, stars);
      const newStage = Math.max(prev.stage, state.stage + 1);
      setUnitProgress(state.unit.id, { stage: newStage, stars: newStars, consecutiveFails: 0 });
    }
    // 보스 카운터
    if (state.isBoss) {
      SAVE.stats.bossDefeats = (SAVE.stats.bossDefeats || 0) + 1;
      if (isPerfect) SAVE.stats.bossPerfects = (SAVE.stats.bossPerfects || 0) + 1;
    }
    if (isPerfect) SAVE.stats.perfectStages = (SAVE.stats.perfectStages || 0) + 1;
    if (!SAVE.stats.gradesPlayed.includes(state.grade)) SAVE.stats.gradesPlayed.push(state.grade);
    recomputeTotalStars();
    saveSave(SAVE);
    checkBadges();
  } else if (!state.isDaily && state.unit) {
    // 단원 실패 → 연속 실패 카운터 +1 (다음 시도에서 적응형 완화 트리거)
    const prev = getUnitProgress(state.unit.id);
    setUnitProgress(state.unit.id, { consecutiveFails: (prev.consecutiveFails || 0) + 1 });
  }
  const newRank = getCurrentRank();
  const rankedUp = passed && newRank.id > prevRank.id;

  // 보물상자: 별 수, 퍼펙트, 스테이지에 따라 확률 상승
  const chestChance = 0.1 + (stars - 1) * 0.1 + (isPerfect ? 0.15 : 0);
  const hasChest = passed && Math.random() < chestChance;
  const chestBonus = Math.round((30 + state.stage * 10 + Math.random() * 50) / 10) * 10;

  const screen = el('div', { class: 'screen' });
  const topbar = el('div', { class: 'topbar' },
    el('button', { class: 'back', onclick: () => render(screenUnits(state.grade)), html: icon('chevron-left', { size: 18 }) }),
    el('div', {},
      el('div', { class: 'title' }, passed ? '스테이지 클리어' : '다시 도전'),
      el('div', { class: 'sub' }, `${state.unit.name} · 스테이지 ${state.stage}`)
    ),
    el('div', { class: 'coins', html: String(SAVE.coins) + '<span class="coin-suffix">P</span>' })
  );

  const result = el('div', { class: 'result' });

  // 퍼펙트 배너
  if (isPerfect) {
    result.appendChild(el('div', { class: 'perfect-banner' }, 'PERFECT'));
  }

  const iconName = passed
    ? (stars === 3 ? 'trophy' : stars === 2 ? 'medal' : 'target')
    : (state.hearts <= 0 ? 'heart-empty' : 'lightbulb');
  result.appendChild(el('div', { class: 'big-icon-wrap ' + (passed ? 'success' : 'fail'), html: icon(iconName, { size: 76, strokeWidth: 1.8 }) }));
  result.appendChild(el('h2', {}, passed ? '잘했어!' : '괜찮아, 한 번 더!'));
  result.appendChild(el('div', { class: 'stage-cleared' },
    `정답 ${correctCount} / ${total} · 하트 ${Math.max(0,state.hearts)} 남음`));

  const starsEl = el('div', { class: 'stars-big' });
  for (let i = 0; i < 3; i++) {
    const starHtml = icon(i < stars ? 'star' : 'star-empty', { size: 44 });
    starsEl.appendChild(el('span', { class: i < stars ? 'star' : 'star empty', html: starHtml }));
  }
  result.appendChild(starsEl);

  if (passed) {
    result.appendChild(el('div', { class: 'reward', html: icon('coin', { size: 16 }) + ' 코인 +' + state.coinsEarned + 'P 획득!' }));

    // 보물상자 (상자 클릭 시 보너스)
    if (hasChest) {
      const chestEl = el('div', { class: 'chest' }, '🎁');
      const hintEl = el('div', { class: 'chest-hint' }, '클릭해서 보물 확인!');
      chestEl.onclick = () => {
        if (chestEl.classList.contains('opened')) return;
        chestEl.classList.add('opened');
        chestEl.textContent = '💰';
        SAVE.coins += chestBonus;
        SAVE.stats.chestsOpened = (SAVE.stats.chestsOpened || 0) + 1;
        saveSave(SAVE);
        playChest();
        hintEl.textContent = `✨ +${chestBonus}P 획득!`;
        hintEl.style.color = '#a16207';
        hintEl.style.fontSize = '13px';
        checkBadges();
      };
      result.appendChild(chestEl);
      result.appendChild(hintEl);
    }

    result.appendChild(el('button', { class: 'btn primary',
      onclick: async () => {
        await maybeShowInterstitial();
        startStage(state.grade, state.unit.id);
      }},
      `다음 스테이지 ${state.stage + 1} ▶`));
  } else {
    result.appendChild(el('button', { class: 'btn primary',
      onclick: () => startStage(state.grade, state.unit.id) },
      `🔄 스테이지 ${state.stage} 다시 하기`));
  }
  result.appendChild(el('button', { class: 'btn ghost',
    onclick: () => render(screenUnits(state.grade)) },
    '단원 목록으로'));

  screen.append(topbar, result);

  // 랭크업 모달
  if (rankedUp) {
    setTimeout(() => showRankUpModal(newRank), 500);
  }

  // Confetti on 3-star clear
  if (passed && stars === 3) {
    setTimeout(() => {
      const colors = ['#ff6b6b','#ffd93d','#6bcf7f','#4d96ff','#c084fc','#ff9eee'];
      for (let i = 0; i < 30; i++) {
        const c = document.createElement('div');
        c.className = 'confetti';
        c.style.left = Math.random() * 100 + '%';
        c.style.background = colors[i % colors.length];
        c.style.animationDelay = (Math.random() * 0.3) + 's';
        c.style.animationDuration = (1 + Math.random()) + 's';
        screen.appendChild(c);
        setTimeout(() => c.remove(), 2500);
      }
    }, 100);
  }

  return screen;
}

// ============================================================
// 랭크업 모달
// ============================================================
function showRankUpModal(rank) {
  playRankUp();
  const overlay = el('div', { class: 'modal-overlay' });
  const modal = el('div', { class: 'rank-up-modal', style: `--rank-color: ${rank.color};` },
    el('div', { class: 'label' }, 'RANK UP'),
    el('div', { class: 'big-icon' }, rank.icon),
    el('div', { class: 'rank-title' }, rank.name),
    el('div', { class: 'rank-sub' }, '새로운 랭크로 성장했어요!'),
    el('button', { class: 'close-btn', onclick: () => overlay.remove() }, '계속하기'),
  );
  overlay.appendChild(modal);
  document.body.appendChild(overlay);
  // 대량 컨페티
  const colors = ['#ff6b6b','#ffd93d','#6bcf7f','#4d96ff','#c084fc','#ff9eee','#f5a623'];
  for (let i = 0; i < 60; i++) {
    const c = document.createElement('div');
    c.className = 'confetti';
    c.style.left = Math.random() * 100 + '%';
    c.style.background = colors[i % colors.length];
    c.style.animationDelay = (Math.random() * 0.5) + 's';
    c.style.animationDuration = (1 + Math.random() * 1.5) + 's';
    c.style.zIndex = '101';
    overlay.appendChild(c);
    setTimeout(() => c.remove(), 3000);
  }
}

// ============================================================
// AdMob 광고 연동 (어린이 앱 정책 준수)
// - ADS_ENABLED = true 로 바꾸면 광고 다시 켜짐
// - 웹 브라우저에서는 어차피 동작 안 함 (조기 return)
// - 배포 전에 AD_INTERSTITIAL_ID를 실제 AdMob ID로, AD_TESTING을 false로
// - 어린이 대상이므로 COPPA/GDPR-K 태그 + 비개인화(npa) 광고 + 전체이용가 등급만
// ============================================================
const ADS_ENABLED = false; // ★ 광고 마스터 스위치 (현재 OFF)
const AD_INTERSTITIAL_ID = 'ca-app-pub-3940256099942544/1033173712';
const AD_TESTING = true;
const AD_SHOW_EVERY_N_CLEARS = 1;
let adStageClearCount = 0;

// 어린이 앱 광고 안전 설정 — 모든 광고 요청에 공통 적용
const AD_CHILD_SAFE = {
  npa: true,                          // 비개인화 광고 (행동 기반 추적 금지)
  tagForChildDirectedTreatment: true, // COPPA: 아동 대상 처리
  tagForUnderAgeOfConsent: true,      // GDPR-K: 동의 연령 미만
  maxAdContentRating: 'General',      // 전체 이용가(G) 등급 광고만
};

function isNativeApp() {
  return !!(window.Capacitor?.isNativePlatform && window.Capacitor.isNativePlatform());
}
function getAdMob() {
  return window.Capacitor?.Plugins?.AdMob;
}

async function initAds() {
  if (!ADS_ENABLED || !isNativeApp()) return;
  const AdMob = getAdMob();
  if (!AdMob) return;
  try {
    await AdMob.initialize({
      initializeForTesting: AD_TESTING,
      tagForChildDirectedTreatment: AD_CHILD_SAFE.tagForChildDirectedTreatment,
      tagForUnderAgeOfConsent: AD_CHILD_SAFE.tagForUnderAgeOfConsent,
      maxAdContentRating: AD_CHILD_SAFE.maxAdContentRating,
    });
    await prepareInterstitial();
  } catch (e) { console.warn('[Ads] init failed', e); }
}

async function prepareInterstitial() {
  if (!ADS_ENABLED || !isNativeApp()) return;
  const AdMob = getAdMob();
  if (!AdMob) return;
  try {
    await AdMob.prepareInterstitial({
      adId: AD_INTERSTITIAL_ID,
      isTesting: AD_TESTING,
      npa: AD_CHILD_SAFE.npa, // 비개인화 광고 강제
    });
  } catch (e) { console.warn('[Ads] prepare failed', e); }
}

async function maybeShowInterstitial() {
  if (!ADS_ENABLED) return;
  adStageClearCount++;
  if (adStageClearCount % AD_SHOW_EVERY_N_CLEARS !== 0) return;
  if (!isNativeApp()) return;
  const AdMob = getAdMob();
  if (!AdMob) return;
  try {
    await AdMob.showInterstitial();
    await prepareInterstitial();
  } catch (e) { console.warn('[Ads] show failed', e); }
}

// ---------- Splash ----------
function showSplash() {
  const splash = document.createElement('div');
  splash.className = 'splash';
  splash.innerHTML = `
    <div class="splash-inner">
      ${logo(96)}
      <div class="splash-title">Math Quest</div>
      <div class="splash-sub">초등 수학 퀘스트</div>
    </div>
  `;
  document.body.appendChild(splash);
  setTimeout(() => { splash.classList.add('fade'); }, 1100);
  setTimeout(() => { splash.remove(); }, 1700);
}

// ---------- Boot ----------
initAds();
showSplash();
render(screenHome());
</script>
